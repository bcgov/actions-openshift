name: 'Crunchy Database Deployment'
description: 'Deploy a Crunchy PostgreSQL database to OpenShift'

inputs:
  # Required
  oc_namespace:
    description: 'OpenShift namespace'
    required: true
  oc_token:
    description: 'OpenShift token'
    required: true

  # Typical / recommended
  environment:
    description: 'Environment name; omit for PRs'
    required: false
  triggers:
    description: |
      Paths used to trigger a deployment (one path per line).
      Example:
        triggers: |
          backend/
          frontend/
    required: false
  oc_server:
    description: 'OpenShift server URL with port'
    required: true
  values_file:
    description: 'Path to a values.yml file in the calling repository; omit to use the bundled values.yml. Cannot be combined with the override inputs below'
    required: false

  # Overrides for the bundled values.yml; unset inputs keep the bundled values
  pvc_size:
    description: 'Data volume size; e.g. 1Gi'
    required: false
  storage_class:
    description: 'Data volume storage class; e.g. netapp-block-standard'
    required: false
  postgres_version:
    description: 'PostgreSQL major version: 15, 16, 17 or 18; selects a matching PostGIS image'
    required: false
  replicas:
    description: 'Number of PostgreSQL instance replicas'
    required: false
  cpu_request:
    description: 'CPU request for PostgreSQL instances; e.g. 50m'
    required: false
  memory_request:
    description: 'Memory request for PostgreSQL instances; e.g. 128Mi'
    required: false
  route_enabled:
    description: 'Create a TLS passthrough Route to the primary database service'
    default: 'false'
    required: false
  route_host:
    description: 'Route host name; requires route_enabled, OpenShift generates one if omitted'
    required: false

  standby_enabled:
    description: >-
      Deploy as a standby cluster that follows WAL from standby_repo_name
      (usually S3 repo2). Requires S3 backups configured on primary and standby.
    default: 'false'
    required: false
  standby_repo_name:
    description: 'pgBackRest repo the standby follows (default repo2 = S3)'
    default: 'repo2'
    required: false
  shutdown:
    description: 'Scale the cluster to zero (keep Services/Volumes) for failover'
    default: 'false'
    required: false

  s3_access_key:
    description: 'S3 access key'
    required: false
  s3_secret_key:
    description: 'S3 secret key'
    required: false
  s3_bucket:
    description: 'S3 bucket'
    required: false
  s3_endpoint:
    description: 'S3 endpoint'
    required: false

  custom_pguser_password:
    description: >-
      Password for the primary app pgUser Secret (global.config.dbName).
      When set, primary and standby clusters can share the same credentials
      (DR / sandbox). Leave empty for the operator to generate one.
    required: false

  dry_run:
    description: 'When true, helm upgrade --dry-run=server --hide-secret validates the chart against the OpenShift API, then the action exits without deploying, waiting, or changing PR users'
    default: 'false'
    required: false

  self_heal_stuck_releases:
    description: 'Purge a Helm release stuck in a non-deployed state (pending-*, failed, uninstalling) before reinstalling. Deletes the PostgresCluster and its data volumes'
    default: 'false'
    required: false

  # Usually a bad idea / not recommended
  force_cleanup:
    description: 'Force cleanup of the database'
    default: 'false'
    required: false
  directory:
    description: 'Chart directory inside repository; used only when repository is set'
    default: 'charts/crunchy'
    required: false
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'Repository to take the chart from, e.g. org/repo; omit to use the chart bundled with this action'
    default: ''
    required: false
  ref:
    description: 'Git ref of repository; used only when repository is set. Empty means the repository default branch.'
    default: ''
    required: false
  release_name:
    description: 'Release name; e.g. pg-qsos-crunchy, make sure it is unique in the namespace you are deploying to'
    default: ''
    required: false
  base:
    description: 'Base to diff triggers against (same meaning as dorny/paths-filter `base`); defaults to the default branch of the repository'
    required: false
    
outputs:
  release:
    description: 'Release name'
    value: ${{ steps.vars.outputs.RELEASE_NAME }}
  cluster:
    description: 'Cluster name'
    value: ${{ steps.vars.outputs.CLUSTER_NAME }}
  secret:
    description: 'Database credentials secret name'
    value: ${{ steps.deploy.outputs.DB_SECRET || steps.vars.outputs.DB_SECRET }}
  host:
    description: 'Database host (pgBouncer or primary service)'
    value: ${{ steps.deploy.outputs.DB_HOST || steps.vars.outputs.DB_HOST }}
  port:
    description: 'Database port'
    value: ${{ steps.deploy.outputs.DB_PORT || steps.vars.outputs.DB_PORT }}
  user:
    description: 'Database user'
    value: ${{ steps.deploy.outputs.DB_USER || steps.vars.outputs.DB_USER }}
  dbname:
    description: 'Database name (libpq dbname)'
    value: ${{ steps.deploy.outputs.DB_NAME || steps.vars.outputs.DB_NAME }}

runs:
  using: "composite"
  steps:
    # Shared input rules (shared/inputs.sh); a bad value fails here
    - name: Parse Inputs
      id: inputs
      shell: bash
      env:
        INPUT_ROUTE_ENABLED: ${{ inputs.route_enabled }}
        INPUT_STANDBY_ENABLED: ${{ inputs.standby_enabled }}
        INPUT_SHUTDOWN: ${{ inputs.shutdown }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_SELF_HEAL_STUCK_RELEASES: ${{ inputs.self_heal_stuck_releases }}
        INPUT_FORCE_CLEANUP: ${{ inputs.force_cleanup }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.sh
      run: |
        # shellcheck source=/dev/null
        source "$SHARED_INPUTS"
        route_enabled="$(input_bool route_enabled "$INPUT_ROUTE_ENABLED" false)" || { echo "$route_enabled"; exit 1; }
        standby_enabled="$(input_bool standby_enabled "$INPUT_STANDBY_ENABLED" false)" || { echo "$standby_enabled"; exit 1; }
        shutdown="$(input_bool shutdown "$INPUT_SHUTDOWN" false)" || { echo "$shutdown"; exit 1; }
        dry_run="$(input_bool dry_run "$INPUT_DRY_RUN" false)" || { echo "$dry_run"; exit 1; }
        self_heal_stuck_releases="$(input_bool self_heal_stuck_releases "$INPUT_SELF_HEAL_STUCK_RELEASES" false)" || { echo "$self_heal_stuck_releases"; exit 1; }
        force_cleanup="$(input_bool force_cleanup "$INPUT_FORCE_CLEANUP" false)" || { echo "$force_cleanup"; exit 1; }
        {
          echo "route_enabled=${route_enabled}"
          echo "standby_enabled=${standby_enabled}"
          echo "shutdown=${shutdown}"
          echo "dry_run=${dry_run}"
          echo "self_heal_stuck_releases=${self_heal_stuck_releases}"
          echo "force_cleanup=${force_cleanup}"
        } >> "$GITHUB_OUTPUT"

    - shell: bash
      id: vars
      env:
        INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        REPO_NAME: ${{ github.event.repository.name }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_NUMBER: ${{ github.event.number }}
      run: |
        # Variables and Inputs

        # Release and cluster name; based on a hash of the repository name
        RELEASE_NAME=''
        if [ -n "${INPUT_RELEASE_NAME}" ]; then
          RELEASE_NAME="${INPUT_RELEASE_NAME}"
        else
          RELEASE_NAME="pg-$(echo -n "${REPO_NAME}" | md5sum | cut -c 1-8)"
        fi
        CLUSTER_NAME="${RELEASE_NAME}-crunchy"

        DB_USER="app"
        DB_NAME="app"
        if [ -n "${EVENT_NUMBER}" ] && [ "${EVENT_NAME}" = "pull_request" ]; then
          DB_USER="app-${EVENT_NUMBER}"
          DB_NAME="app-${EVENT_NUMBER}"
        fi
        DB_SECRET="${CLUSTER_NAME}-pguser-${DB_USER}"
        DB_HOST="${CLUSTER_NAME}-pgbouncer"
        DB_PORT="5432"

        # Process vars and send to GITHUB_ENV (local vars) and GITHUB_OUTPUT (outputs)
        for var in RELEASE_NAME CLUSTER_NAME DB_SECRET DB_HOST DB_PORT DB_USER DB_NAME; do
          if [ -n "${!var}" ]; then
            echo "${var}=${!var}"
            echo "${var}=${!var}" >> $GITHUB_ENV
            echo "${var}=${!var}" >> $GITHUB_OUTPUT
          else
            echo "Warning: ${var} is not set."
            exit 1
          fi
        done

    - shell: bash
      if: github.event.action != 'closed'
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        S3_ACCESS_KEY: ${{ inputs.s3_access_key }}
        S3_SECRET_KEY: ${{ inputs.s3_secret_key }}
        S3_BUCKET: ${{ inputs.s3_bucket }}
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        BRANCH_OR_REF: ${{ github.head_ref || github.ref_name || github.event.repository.default_branch }}
        REPO: ${{ github.repository }}
        VALUES_FILE: ${{ inputs.values_file }}
      run: |
        # Variables and Inputs (!= closed)

        # S3 backups need all four S3 inputs or none
        s3_vars=()
        for v in "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" "${S3_BUCKET}" "${S3_ENDPOINT}"; do
          if [ -n "$v" ]; then
            s3_vars+=("$v")
          fi
        done
        if [ "${#s3_vars[@]}" -eq 4 ]; then
          echo "All S3 configuration variables are present. Enabling S3 backups."
        elif [ "${#s3_vars[@]}" -gt 0 ]; then
          echo "Warning: Some S3 configuration variables are set, but not all. Please ensure all S3 variables are configured."
          exit 1
        else
          echo "S3 configuration not set. Disabling S3 backups."
        fi

        # No values_file: deploy_db.sh uses the bundled values.yml
        VALUES_URL=""
        if [ -n "${VALUES_FILE}" ]; then
          # Construct values.yml URL (ref_name = PR, ref_name = merge, default_branch = default)
          VALUES_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_OR_REF}/${VALUES_FILE}"

          # Build curl auth options if a token is provided (required for private repositories)
          CURL_AUTH_OPTS=()
          if [ -n "${GITHUB_TOKEN}" ]; then
            CURL_AUTH_OPTS=(-H "Authorization: token ${GITHUB_TOKEN}")
          fi

          # Validate values.yml URL
          if ! curl "${CURL_AUTH_OPTS[@]}" --output /dev/null --silent --head --fail "${VALUES_URL}"; then
            echo "Error: The constructed values.yml URL is invalid or inaccessible: ${VALUES_URL}"
            echo "Hint: If this is a private repository, please ensure that:"
            echo "  1. The workflow permissions are set to 'contents: read'."
            echo "  2. A valid 'token' is supplied if accessing a private file."
            exit 1
          fi
        fi
        echo "VALUES_URL=${VALUES_URL}"
        echo "VALUES_URL=${VALUES_URL}" >> $GITHUB_ENV

    - id: triggers
      uses: bcgov/actions/diff-triggers@8843560d44aa717798dacb6831bf87161d0658ca # v0.11.0
      with:
        triggers: ${{ inputs.triggers }}
        base: ${{ inputs.base }}
    # Alway install don't consider triggers here.
    - uses: $/oc-runner
      with:
        oc_namespace: "${{ inputs.oc_namespace }}"
        oc_token: "${{ inputs.oc_token }}"
        oc_server: "${{ inputs.oc_server }}"
        repository: ${{ github.repository }}                          # Always use the downstream
        ref: ${{ github.event.pull_request.base.ref || github.ref }}  # repository to run diffs!

    - if: inputs.repository != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}

    - if: github.event.action != 'closed'
      id: deploy
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_NUMBER: ${{ github.event.number }}
        GITHUB_TOKEN: ${{ inputs.token }}
        DIRECTORY: ${{ inputs.directory }}
        REPO_NAME: ${{ github.event.repository.name }}
        TRIGGERED: ${{ steps.triggers.outputs.triggered }}
        S3_ACCESS_KEY: ${{ inputs.s3_access_key }}
        S3_SECRET_KEY: ${{ inputs.s3_secret_key }}
        S3_BUCKET: ${{ inputs.s3_bucket }}
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        CUSTOM_PGUSER_PASSWORD: ${{ inputs.custom_pguser_password }}
        PVC_SIZE: ${{ inputs.pvc_size }}
        STORAGE_CLASS: ${{ inputs.storage_class }}
        POSTGRES_VERSION: ${{ inputs.postgres_version }}
        REPLICAS: ${{ inputs.replicas }}
        CPU_REQUEST: ${{ inputs.cpu_request }}
        MEMORY_REQUEST: ${{ inputs.memory_request }}
        ROUTE_ENABLED: ${{ steps.inputs.outputs.route_enabled }}
        ROUTE_HOST: ${{ inputs.route_host }}
        STANDBY_ENABLED: ${{ steps.inputs.outputs.standby_enabled }}
        STANDBY_REPO_NAME: ${{ inputs.standby_repo_name }}
        SHUTDOWN: ${{ steps.inputs.outputs.shutdown }}
        SELF_HEAL_STUCK_RELEASES: ${{ steps.inputs.outputs.self_heal_stuck_releases }}
        DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
        CHART_REPOSITORY: ${{ inputs.repository }}
      run: |
        # Deploy the database

        # Bundled chart unless a chart repository was given. Copied so deploy_db.sh
        # can edit Chart.yaml and package in place without touching the action directory.
        if [ -z "${CHART_REPOSITORY}" ]; then
          DIRECTORY="$(mktemp -d)"
          trap 'rm -rf "${DIRECTORY}"' EXIT
          cp -r "${GITHUB_ACTION_PATH}/charts/crunchy/." "${DIRECTORY}"
        fi

        # Check if S3 inputs are provided and construct the deploy_db.sh command accordingly
        # Array, so an empty VALUES_URL (bundled values) keeps its position
        PARAMS=("${DIRECTORY}" "${VALUES_URL}" "${REPO_NAME}" "${RELEASE_NAME}" "${TRIGGERED}")
        if [ -n "${S3_ACCESS_KEY}" ] && [ -n "${S3_SECRET_KEY}" ] && [ -n "${S3_BUCKET}" ] && [ -n "${S3_ENDPOINT}" ]; then
          PARAMS+=("${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" "${S3_BUCKET}" "${S3_ENDPOINT}")
        fi

        # Execute the deploy command
        echo "$GITHUB_ACTION_PATH/scripts/deploy_db.sh [arguments redacted]"
        "$GITHUB_ACTION_PATH/scripts/deploy_db.sh" "${PARAMS[@]}"

        # Export effective database contract outputs from deployed values
        EFFECTIVE_DB_NAME="$(yq -r '.global.config.dbName // "app"' "${DIRECTORY}/values.yml" 2>/dev/null || echo "app")"
        PGBOUNCER_ENABLED="$(yq -r '.crunchy.proxy.enabled // true' "${DIRECTORY}/values.yml" 2>/dev/null || echo "true")"

        if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${EVENT_NUMBER}" ]; then
          DB_USER="app-${EVENT_NUMBER}"
          DB_NAME="app-${EVENT_NUMBER}"
        else
          DB_USER="${EFFECTIVE_DB_NAME}"
          DB_NAME="${EFFECTIVE_DB_NAME}"
        fi

        if [ "${PGBOUNCER_ENABLED}" = "true" ]; then
          DB_HOST="${CLUSTER_NAME}-pgbouncer"
        else
          DB_HOST="${CLUSTER_NAME}-primary"
        fi

        DB_SECRET="${CLUSTER_NAME}-pguser-${DB_USER}"
        DB_PORT="5432"

        echo "DB_USER=${DB_USER}" >> $GITHUB_OUTPUT
        echo "DB_NAME=${DB_NAME}" >> $GITHUB_OUTPUT
        echo "DB_HOST=${DB_HOST}" >> $GITHUB_OUTPUT
        echo "DB_SECRET=${DB_SECRET}" >> $GITHUB_OUTPUT
        echo "DB_PORT=${DB_PORT}" >> $GITHUB_OUTPUT

    - if: github.event_name == 'pull_request' && github.event.action != 'closed' && steps.inputs.outputs.dry_run != 'true'
      shell: bash
      env:
        EVENT_NUMBER: ${{ github.event.number }}
      run: |
        # Add user to Crunchy DB
        "$GITHUB_ACTION_PATH/scripts/user_change.sh" add "${EVENT_NUMBER}" "${CLUSTER_NAME}"

    - if: (github.event.action == 'closed' || steps.inputs.outputs.force_cleanup == 'true') && steps.inputs.outputs.dry_run != 'true'
      shell: bash
      env:
        EVENT_NUMBER: ${{ github.event.number }}
      run: |
        # Remove PR specific user from Crunchy DB
        "$GITHUB_ACTION_PATH/scripts/user_change.sh" remove "${EVENT_NUMBER}" "${CLUSTER_NAME}"
