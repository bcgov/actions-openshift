name: .Helm Deployer

on:
  workflow_call:
    inputs:
      ### Required
      # Only secrets!

      ### Typical / recommended
      atomic:
        description: Atomic deployment?  That means fail all or nothing
        default: 'true'
        required: false
        type: string
      directory:
        description: Chart directory
        default:  'charts/app'
        required: false
        type: string
      environment:
        description: Environment name; omit for PRs
        required: false
        type: string
      oc_server:
        default: https://api.silver.devops.gov.bc.ca:6443
        description: 'OpenShift server'
        required: false
        type: string
      params:
        description: 'Extra parameters to pass to helm upgrade'
        default: ''
        required: false
        type: string
      promote_images:
        description: 'List of images to promote with a new tag'
        default: ''
        required: false
        type: string
      promote_tags:
        description: 'Tag to apply to promoted images'
        default: ''
        required: false
        type: string
      tag:
        description: 'Tag to deploy. On pull_request an empty tag becomes the PR number. When promote_images is set and tag is empty, image-tracker supplies the PR number and that value is used. push and merge must set tag unless promote_images resolves one.'
        required: false
        type: string
      triggers:
        description: Paths used to trigger a deployment; e.g. ('./backend/' './frontend/)
        required: false
        type: string

      ### Usually a bad idea / not recommended
      repository:
        description: Optionally, specify a different repo to clone
        default: ${{ github.repository }}
        required: false
        type: string
      timeout-minutes:
        description: 'Timeout minutes'
        default: 10
        required: false
        type: number
      values:
        description: 'Values file'
        default: 'values.yaml'
        required: false
        type: string

    outputs:
      triggered:
        description: 'Has a deployment has been triggered?'
        value: ${{ jobs.deploy.outputs.triggered }}

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true

jobs:
  deploy:
    name: Helm
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.vars.outputs.packages }}
      tag: ${{ steps.vars.outputs.tag }}
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      ### Triggers, tag and release

      # inputs.tag wins. When tag is empty and promote_images is set, image-tracker
      # supplies the PR number and that value is used. Otherwise pull_request
      # uses the event PR number. push and merge must set tag when it does not.
      - name: Checkout
        if: inputs.tag == '' && inputs.promote_images != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR from images
        id: tracker
        if: inputs.tag == '' && inputs.promote_images != ''
        uses: bcgov/actions/image-tracker@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          max_depth: 100
          package: ${{ inputs.promote_images }}

      - name: Vars
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          PROMOTE_IMAGES: ${{ inputs.promote_images }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          RUN_NUMBER: ${{ github.run_number }}
          TRACKED_PR: ${{ steps.tracker.outputs.pr }}
          TRACKER_OUTCOME: ${{ steps.tracker.outcome }}
        run: |
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ] && [ "${TRACKER_OUTCOME}" = "success" ]; then
            tag="${TRACKED_PR}"
            if [[ ! "${tag}" =~ ^[0-9]+$ ]]; then
              echo "::error::image-tracker did not return a numeric PR number; set tag."
              exit 1
            fi
          fi
          if [ -z "${tag}" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            tag="$(jq -r '.number // empty' "${GITHUB_EVENT_PATH}")"
            if [[ ! "${tag}" =~ ^[0-9]+$ ]]; then
              echo "::error::pull_request payload has no numeric PR number; set tag."
              exit 1
            fi
          fi
          if [ -z "${tag}" ]; then
            echo "::error::tag is required for ${GITHUB_EVENT_NAME}. On pull_request it defaults to the PR number. When promote_images is set, image-tracker supplies it. push and merge callers must set tag otherwise."
            exit 1
          fi

          # Release name includes run numbers to ensure uniqueness
          target_env="${INPUT_ENVIRONMENT:-$tag}"
          release="${REPOSITORY_NAME}-${target_env}"
          
          # Version, used for non-PR releases
          version="1.0.0-${RUN_NUMBER}"
          
          # Summary
          echo "tag=${tag}"
          echo "release=${release}"
          echo "version=${version}"

          # Output
          {
            echo "tag=${tag}"
            echo "release=${release}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

          # Convert packages to JSON array for job matrix
          read -r -a pkgs <<< "$PROMOTE_IMAGES"
          echo "packages=$(jq -cn '$ARGS.positional' --args "${pkgs[@]}")" >> "$GITHUB_OUTPUT"

      ### Deploy
      - name: Interrupt deployments (PR only)
        id: deploy
        if: github.event_name == 'pull_request'
        uses: $/oc-runner
        env:
          RELEASE: ${{ steps.vars.outputs.release }}
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ inputs.oc_server }}
          repository: ${{ inputs.repository }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # Interrupt any previous deployments (PR only)
            PREVIOUS=$(helm status "$RELEASE" -o json | jq .info.status || true)
            if [[ ${PREVIOUS} =~ pending ]]; then
              echo "Rollback triggered"
              helm rollback "$RELEASE" || \
                helm uninstall "$RELEASE"
            fi

  promote:
    name: Promote Images
    if: inputs.promote_images != '' && inputs.promote_tags != ''
    needs: [deploy]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: ${{ fromJson(needs.deploy.outputs.packages) }}
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          tags: ${{ inputs.promote_tags }}
          target: ${{ needs.deploy.outputs.tag }}
