name: PG Upgrade

# pg-upgrade's own tests: unit tests, and every supported source major upgraded to
# quickstart-openshift's major and to the newest postgres major on Docker Hub (versions.sh), in containers.
# Every pull request and main push runs the cheap path filter; the unit and container jobs
# run only when pg-upgrade or the oc-runner login it calls changed (Markdown excluded),
# so their checks still report, as skipped, instead of disappearing.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: PG Upgrade (changes)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          ref: ${{ steps.base.outputs.sha || github.event.before }}
          # pg-upgrade/action.yml calls oc-runner only to log in
          triggers: |
            pg-upgrade/
            .github/tests/pg-upgrade/
            .github/workflows/pg-upgrade.yml
            oc-runner/action.yml
            oc-runner/scripts/login.sh
            !*.md

  versions:
    name: PG Upgrade (versions)
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      containers: ${{ steps.versions.outputs.containers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Supported sources, golden path and newest major
        id: versions
        run: .github/tests/pg-upgrade/versions.sh

  unit:
    name: PG Upgrade (unit)
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck pg-upgrade/scripts/*.sh .github/tests/pg-upgrade/*.sh

      - name: Unit tests (bats, 2 workers)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats parallel
          bats --jobs 2 .github/tests/pg-upgrade

  containers:
    name: PG Upgrade (containers, ${{ matrix.name }})
    needs: versions
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.containers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upgrade, rehearsal, rollback and failure paths, for postgres and (where it exists) PostGIS
      - name: Run job.sh against real databases
        env:
          ENGINE: docker
          PG_OLD: ${{ matrix.pg_old }}
          PG_NEW: ${{ matrix.pg_new }}
          GIS_OLD: ${{ matrix.gis_old }}
          GIS_NEW: ${{ matrix.gis_new }}
        run: .github/tests/pg-upgrade/container_test.sh

  # Merge gate for this workflow: always reports, skipped jobs count as passing
  results:
    name: PG Upgrade Results
    needs:
      - changes
      - versions
      - unit
      - containers
    if: always()
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
