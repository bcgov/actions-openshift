name: Cert Expiry Tests

# Tests for the cert-expiry action: bats unit tests against local openssl
# s_server certificates, and a live read of a known host (github.com) on both
# ubuntu-26.04 and ubuntu-slim (the runner quickstart-openshift's scheduled
# jobs use). Scheduling and notifying belong to each calling repository.

# Always runs on pull requests and main pushes so Cert Expiry Results reports; the test
# jobs run only when cert-expiry changed (Markdown excluded).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Cert Expiry (changes)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          base: ${{ steps.base.outputs.sha || github.event.before }}
          triggers: |
            cert-expiry/
            shared/inputs.sh
            .github/tests/cert-expiry/
            .github/workflows/cert-expiry-tests.yml
            !*.md

  unit:
    name: Test cert-expiry (bats)
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (bats, 2 workers)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats parallel openssl
          bats --jobs 2 .github/tests/cert-expiry

  known-host:
    name: Test cert-expiry (known host, ${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-slim]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A 3650-day window flags any real certificate, so this proves a live
      # read without depending on when github.com renews. The no-finding path
      # is covered by the bats tests.
      - name: Known host (github.com)
        id: known
        uses: $/cert-expiry
        with:
          hosts: github.com
          days: "3650"
          fail_on_findings: "false"

      - name: Check known-host result
        env:
          FINDINGS: ${{ steps.known.outputs.findings }}
          CHECKED: ${{ steps.known.outputs.checked }}
        run: |
          set -euo pipefail
          [ "$CHECKED" = "1" ] || { echo "::error::Expected checked=1, got ${CHECKED}"; exit 1; }
          jq -e 'length == 1 and .[0].host == "github.com" and .[0].status == "expiring" and (.[0].not_after | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))' <<< "$FINDINGS" > /dev/null \
            || { echo "::error::Expected github.com as expiring with a read expiry date, got ${FINDINGS}"; exit 1; }
          echo "Known-host check passed: $(jq -r '.[0].not_after' <<< "$FINDINGS")"

      - name: Failing check fails the step (for if failure() notify)
        id: failing
        continue-on-error: true
        uses: $/cert-expiry
        with:
          hosts: github.com
          days: "3650"

      - name: Check failing step outcome
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          FINDINGS: ${{ steps.failing.outputs.findings }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::Expected the step to fail, got ${OUTCOME}"; exit 1; }
          jq -e 'length == 1' <<< "$FINDINGS" > /dev/null || { echo "::error::Expected findings on failure, got ${FINDINGS}"; exit 1; }
          echo "Failing step failed and still set findings"

  # Merge gate for this workflow: always reports, skipped jobs count as passing
  results:
    name: Cert Expiry Results
    needs:
      - changes
      - unit
      - known-host
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
