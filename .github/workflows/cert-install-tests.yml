name: Cert Install Tests

# Tests for cert-keeper's gate, validation, install script and log hygiene.
# Always runs on pull requests and main pushes so Cert Install Results reports; the test
# jobs run only when cert-keeper install/gate or shared dependencies changed (Markdown excluded).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Cert Install (changes)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          base: ${{ steps.base.outputs.sha || github.event.before }}
          triggers: |
            cert-keeper/action.yml
            cert-keeper/decide.sh
            cert-keeper/install.sh
            cert-keeper/issue.sh
            cert-keeper/preflight.sh
            cert-keeper/route-guard.sh
            shared/inputs.sh
            oc-runner/action.yml
            oc-runner/scripts/
            .github/tests/cert-keeper/gate.bats
            .github/tests/cert-keeper/install.bats
            .github/tests/cert-keeper/install-summary.bats
            .github/tests/cert-keeper/route-guard.bats
            .github/tests/cert-keeper/validate.bats
            .github/workflows/cert-install-tests.yml
            !*.md

  unit:
    name: Test cert install (bats)
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (bats, 2 workers)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats parallel openssl
          bats --jobs 2 \
            .github/tests/cert-keeper/gate.bats \
            .github/tests/cert-keeper/install.bats \
            .github/tests/cert-keeper/install-summary.bats \
            .github/tests/cert-keeper/route-guard.bats \
            .github/tests/cert-keeper/validate.bats

  test-cert-keeper-install:
    name: Test cert-keeper install
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code to Subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fixture

      - name: Generate test CA chain
        run: |
          set -euo pipefail
          # Throwaway root CA -> issuing CA -> leaf, plus failing variants. Nothing is committed.
          d="${RUNNER_TEMP}/tls"
          mkdir -p "$d"
          cd "$d"
          printf 'basicConstraints=critical,CA:TRUE\nkeyUsage=critical,keyCertSign,cRLSign\n' > ca.cnf
          printf 'subjectAltName=DNS:myapp.bcgov.ca\n' > leaf.cnf
          expired=(-not_before 20200101000000Z -not_after 20210101000000Z)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout root.key -out root.pem -days 30 -subj "/CN=Test Root CA"
          openssl req -newkey rsa:2048 -nodes -keyout int.key -out int.csr -subj "/CN=Test Issuing CA"
          openssl x509 -req -in int.csr -CA root.pem -CAkey root.key -CAcreateserial -extfile ca.cnf -days 30 -out int.pem
          openssl x509 -req -in int.csr -CA root.pem -CAkey root.key -CAcreateserial -extfile ca.cnf "${expired[@]}" -out int-expired.pem
          openssl req -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj "/CN=myapp.bcgov.ca"
          openssl x509 -req -in leaf.csr -CA int.pem -CAkey int.key -CAcreateserial -extfile leaf.cnf -days 30 -out leaf.pem
          openssl x509 -req -in leaf.csr -CA int.pem -CAkey int.key -CAcreateserial -extfile leaf.cnf "${expired[@]}" -out leaf-expired.pem
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out other.key
          cat int.pem root.pem > ca.pem
          cat root.pem int.pem > ca-reversed.pem
          cat leaf.pem int.pem > fullchain.pem
          # Mask every PEM body line, so env and input displays show *** instead
          for f in *.pem *.key; do
            grep -v -e '-----' "$f" | while IFS= read -r line; do echo "::add-mask::${line}"; done
          done

      - name: Script dry-run
        env:
          ROUTE_HOST: myapp.bcgov.ca
          ROUTE_NAME: my-test-route
          TARGET_SERVICE: my-test-service
          TLS_CERTIFICATE_FILE: ${{ runner.temp }}/tls/leaf.pem
          TLS_PRIVATE_KEY_FILE: ${{ runner.temp }}/tls/leaf.key
          TLS_CA_CERTIFICATE_FILE: ${{ runner.temp }}/tls/ca.pem
          OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
          OC_SERVER: ${{ vars.OC_SERVER }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          DRY_RUN: "true"
          ROUTE_OUT: /tmp/route.yml
        run: |
          set -euo pipefail
          mkdir -p /tmp/bin
          printf '%s\n' '#!/bin/bash' 'exit 0' > /tmp/bin/oc
          chmod +x /tmp/bin/oc
          export PATH="/tmp/bin:${PATH}"
          output="$(./fixture/cert-keeper/install.sh 2>&1)" || { echo "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -qE 'BEGIN (PRIVATE KEY|RSA PRIVATE KEY)'; then
            echo "install.sh leaked a private key to stdout/stderr"
            exit 1
          fi
          grep -qF 'PASS: CA chain (2 certificate(s)) issued the certificate, in order, none expired' <<< "$output"
          grep -q '^    caCertificate: |' /tmp/route.yml
          grep -q '^    certificate: |' /tmp/route.yml
          grep -q '^    key: |' /tmp/route.yml
          if grep -q '^  caCertificate:' /tmp/route.yml; then
            echo "caCertificate was written as a spec sibling"
            exit 1
          fi

      - name: Script rejects bad TLS material
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/tls"
          # $1 name, $2 error, $3 start of the Fix line, then VAR=value overrides
          expect_fail() {
            local name="$1" error="$2" fix="$3" output line f
            shift 3
            if output="$(env ROUTE_HOST=myapp.bcgov.ca ROUTE_NAME=my-test-route TARGET_SERVICE=my-test-service \
              TLS_CERTIFICATE_FILE="${d}/leaf.pem" TLS_PRIVATE_KEY_FILE="${d}/leaf.key" TLS_CA_CERTIFICATE_FILE="${d}/ca.pem" \
              DRY_RUN=true ROUTE_OUT="${d}/route-${name}.yml" "$@" ./fixture/cert-keeper/install.sh 2>&1)"; then
              echo "::error::${name}: expected a failure"
              exit 1
            fi
            grep -qF -- "$error" <<< "$output" || { echo "::error::${name}: missing error '${error}'"; exit 1; }
            grep -qF -- "Fix: ${fix}" <<< "$output" || { echo "::error::${name}: missing 'Fix: ${fix}'"; exit 1; }
            for f in "$d"/*.pem "$d"/*.key; do
              while IFS= read -r line; do
                if grep -qF -- "$line" <<< "$output"; then
                  echo "::error::${name}: output contains a line of $(basename "$f")"
                  exit 1
                fi
              done < <(grep -v -e '-----' "$f")
            done
            echo "PASS: ${name}"
          }
          expect_fail expired-leaf "Certificate has expired." "Renew the certificate" \
            TLS_CERTIFICATE_FILE="${d}/leaf-expired.pem"
          expect_fail expired-ca "TLS_CA_CERTIFICATE certificate 1 has expired." "Replace certificate 1 with the current CA" \
            TLS_CA_CERTIFICATE_FILE="${d}/int-expired.pem"
          expect_fail wrong-ca-order "TLS_CA_CERTIFICATE certificate 1 did not issue TLS_CERTIFICATE." "Reorder TLS_CA_CERTIFICATE so the issuer of the leaf comes first" \
            TLS_CA_CERTIFICATE_FILE="${d}/ca-reversed.pem"
          expect_fail mismatched-key "TLS certificate and private key do not match." "Use the key that made this certificate's CSR" \
            TLS_PRIVATE_KEY_FILE="${d}/other.key"
          expect_fail host-not-covered "Certificate does not cover host 'wrong.example'" "Set hostname to a name the certificate covers" \
            ROUTE_HOST=wrong.example
          expect_fail full-chain "TLS_CERTIFICATE must hold only the leaf certificate (found 2)." "Put only the leaf (first block) in TLS_CERTIFICATE" \
            TLS_CERTIFICATE_FILE="${d}/fullchain.pem"

  test-cert-keeper-install-logs:
    name: Test cert-keeper install logs
    needs: [changes, test-cert-keeper-install]
    # Failed runs are the likeliest to have printed PEM data
    if: ${{ !cancelled() && needs.changes.outputs.triggered == 'true' }}
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: No PEM contents in the cert-keeper install job log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --paginate \
            --jq '.jobs[] | "\(.id)\t\(.name)\t\(.conclusion)"')"
          failed=0
          for name in "Test cert-keeper install"; do
            job_id="$(awk -F'\t' -v n="$name" '$2 == n { print $1 }' <<< "$jobs")"
            conclusion="$(awk -F'\t' -v n="$name" '$2 == n { print $3 }' <<< "$jobs")"
            [ -n "$job_id" ] || { echo "::error::${name} job not found"; exit 1; }
            if [ "$conclusion" = "skipped" ]; then
              echo "${name} skipped; not scanning its log"
              continue
            fi
            log="${RUNNER_TEMP}/${job_id}.log"
            # Raw logs hold ANSI colour codes; the log is only scanned, never printed
            gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "$log"
            [ -s "$log" ] || { echo "::error::${name} log is empty"; exit 1; }
            # A PEM body line is 64 base64 characters. Count only; never print a match.
            leaks="$(sed -E 's/\x1b\[[0-9;]*m//g; s/^[0-9T:.-]+Z //' "$log" | grep -cE '^[[:space:]]*[A-Za-z0-9+/]{64}[[:space:]]*$' || true)"
            if [ "$leaks" -ne 0 ]; then
              echo "::error::${name} log holds ${leaks} PEM body line(s)"
              failed=1
            else
              echo "PASS: ${name}: no PEM body lines in $(wc -l < "$log") log lines"
            fi
          done
          exit "$failed"

  # Merge gate for this workflow: always reports, skipped jobs count as passing
  results:
    name: Cert Install Results
    needs:
      - changes
      - unit
      - test-cert-keeper-install
      - test-cert-keeper-install-logs
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
