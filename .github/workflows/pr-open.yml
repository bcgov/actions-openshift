name: PR

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$(pwd)":/repo -w /repo rhysd/actionlint:latest

      - name: Audit composite actions for script injection
        run: python3 scripts/audit_composite_actions.py

  test-deployer:
    name: Test Deployer (${{ matrix.name }})
    # Needs OpenShift credentials: same-repo PRs only (fork and push events get none)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name: [backend, database, frontend]
        include:
          - name: backend
            file: deployer/templates/backend.yml
            overwrite: true
            # Fake secret for the leak check; & < $ get JSON-escaped, defeating log masking
            parameters: -p RANDOM_EXPRESSION='LeakCanary7f3a&x<y$z'
          - name: database
            file: deployer/templates/database.yml
            overwrite: false
          - name: frontend
            file: deployer/templates/frontend.yml
            oc_version: "4.13"
            overwrite: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy
        uses: $/deployer
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: ${{ matrix.oc_version }}
          overwrite: ${{ matrix.overwrite }}
          triggers: ('deployer/', '.github/workflows/pr-open.yml')
          debug: true
          parameters: -p NAME=${{ github.event.repository.name }} -p ZONE=${{ github.event.number }} ${{ matrix.parameters }}

      - name: Check rendered template did not leak
        env:
          CANARY: LeakCanary7f3a
        run: |
          set -euo pipefail
          if [ -n "${TEMPLATE+x}" ]; then
            echo "::error::TEMPLATE env var is visible to later steps"
            exit 1
          fi
          if env | grep -v '^CANARY=' | grep -qF "${CANARY}"; then
            echo "::error::Template content found in the job environment"
            exit 1
          fi
          # GITHUB_ENV/GITHUB_OUTPUT files of earlier steps sit next to this step's
          if grep -rqF "${CANARY}" "$(dirname "${GITHUB_ENV}")"; then
            echo "::error::Template content was written to a GITHUB_ENV/GITHUB_OUTPUT file"
            exit 1
          fi
          if compgen -G "${RUNNER_TEMP}/deployer-template*" > /dev/null; then
            echo "::error::Rendered template file was not removed"
            exit 1
          fi
          echo "No template leak found"

  test-crunchy:
    name: Test Crunchy
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Unit tests (bats)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats openssl
          bats .github/tests/crunchy .github/tests/route-tls

      - name: Helm lint
        run: helm lint crunchy/charts/crunchy --values crunchy/values.yml

      - name: Render with bundled values
        run: |
          set -euo pipefail
          helm template smoke crunchy/charts/crunchy --values crunchy/values.yml > /tmp/render-default.yaml
          grep -q '^kind: PostgresCluster' /tmp/render-default.yaml
          if grep -q '^kind: Route' /tmp/render-default.yaml; then
            echo "::error::Route rendered without route.enabled"
            exit 1
          fi

      - name: Render a values file without a route block
        run: |
          set -euo pipefail
          yq 'del(.route)' crunchy/values.yml > /tmp/values-noroute.yml
          helm template smoke crunchy/charts/crunchy --values /tmp/values-noroute.yml > /tmp/render-noroute.yaml
          grep -q '^kind: PostgresCluster' /tmp/render-noroute.yaml
          if grep -q '^kind: Route' /tmp/render-noroute.yaml; then
            echo "::error::Route rendered without a route block"
            exit 1
          fi

      - name: Render with overrides (PG17, PVC size, route)
        env:
          POSTGRES_VERSION: "17"
          PVC_SIZE: 500Mi
          ROUTE_ENABLED: "true"
          ROUTE_HOST: pg.example.com
        run: |
          set -euo pipefail
          ARGS="$(./crunchy/scripts/resolve_helm_args.sh)"
          # shellcheck disable=SC2086 # validated args contain no whitespace
          helm template smoke crunchy/charts/crunchy --values crunchy/values.yml $ARGS > /tmp/render-overrides.yaml
          grep -q '^kind: PostgresCluster' /tmp/render-overrides.yaml
          grep -q 'crunchy-postgres-gis:ubi9-17.7-3.6-2547' /tmp/render-overrides.yaml
          grep -q 'postgresVersion: 17' /tmp/render-overrides.yaml
          grep -q 'postGISVersion: "3.6"' /tmp/render-overrides.yaml
          grep -q 'storage: 500Mi' /tmp/render-overrides.yaml
          grep -q '^kind: Route' /tmp/render-overrides.yaml
          grep -q 'host: pg.example.com' /tmp/render-overrides.yaml
          grep -q 'termination: passthrough' /tmp/render-overrides.yaml

      - name: deploy_db.sh fails fast before side effects
        run: |
          set -euo pipefail
          if output="$(PVC_SIZE=1Gi ./crunchy/scripts/deploy_db.sh crunchy/charts/crunchy https://example.com/values.yml app smoke true 2>&1)"; then
            echo "::error::values_file with pvc_size did not fail"
            exit 1
          fi
          grep -q 'values_file cannot be combined with override inputs (pvc_size)' <<< "$output"
          mkdir -p /tmp/chart-noroute
          cp -r crunchy/charts/crunchy/. /tmp/chart-noroute
          rm /tmp/chart-noroute/templates/route.yaml
          if output="$(ROUTE_ENABLED=true ./crunchy/scripts/deploy_db.sh /tmp/chart-noroute '' app smoke true 2>&1)"; then
            echo "::error::route_enabled with a chart lacking route.yaml did not fail"
            exit 1
          fi
          grep -q 'has no templates/route.yaml' <<< "$output"

  test-route-tls:
    name: Test Route TLS
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code to Subdirectory
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: fixture

      - name: Verify sibling calls use $/
        run: |
          set -euo pipefail
          echo "Verifying composite actions do not use relative path './' for sibling calls..."
          if grep -rnE 'uses:\s*\./' fixture/*/action.yml; then
            echo "::error::Relative path './' found in action.yml. Sibling actions must be called using '$/<action>'."
            exit 1
          fi
          echo "Checking sibling action references..."
          for action in route-tls cleanup-pr; do
            if ! grep -q 'uses: \$/oc-runner' "fixture/$action/action.yml"; then
              echo "::error::$action/action.yml must reference oc-runner via 'uses: $/oc-runner'"
              exit 1
            fi
          done
          echo "All sibling action references verified to use '$/'."

      - name: Generate dummy certificates
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem \
            -days 30 -nodes -subj "/CN=myapp.bcgov.ca" \
            -addext "subjectAltName=DNS:myapp.bcgov.ca"
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/other-key.pem -out /tmp/other.pem \
            -days 30 -nodes -subj "/CN=other.example"
          cp /tmp/cert.pem /tmp/ca.pem
          {
            echo "DUMMY_CERT<<EOF"
            cat /tmp/cert.pem
            echo "EOF"
            echo "DUMMY_KEY<<EOF"
            cat /tmp/key.pem
            echo "EOF"
            echo "DUMMY_CA<<EOF"
            cat /tmp/ca.pem
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Script dry-run
        env:
          ROUTE_HOST: myapp.bcgov.ca
          ROUTE_NAME: my-test-route
          TARGET_SERVICE: my-test-service
          TLS_CERTIFICATE_FILE: /tmp/cert.pem
          TLS_PRIVATE_KEY_FILE: /tmp/key.pem
          TLS_CA_CERTIFICATE_FILE: /tmp/ca.pem
          OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
          OC_SERVER: ${{ vars.OC_SERVER }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          DRY_RUN: "true"
          ROUTE_OUT: /tmp/route.yml
        run: |
          set -euo pipefail
          mkdir -p /tmp/bin
          printf '%s\n' '#!/bin/bash' 'exit 0' > /tmp/bin/oc
          chmod +x /tmp/bin/oc
          export PATH="/tmp/bin:${PATH}"
          output="$(./fixture/route-tls/provision.sh 2>&1)" || { echo "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -qE 'BEGIN (PRIVATE KEY|RSA PRIVATE KEY)'; then
            echo "provision.sh leaked a private key to stdout/stderr"
            exit 1
          fi
          grep -q '^    caCertificate: |' /tmp/route.yml
          grep -q '^    certificate: |' /tmp/route.yml
          grep -q '^    key: |' /tmp/route.yml
          if grep -q '^  caCertificate:' /tmp/route.yml; then
            echo "caCertificate was written as a spec sibling"
            exit 1
          fi

      - name: Script rejects mismatched key
        env:
          ROUTE_HOST: myapp.bcgov.ca
          ROUTE_NAME: my-test-route
          TARGET_SERVICE: my-test-service
          TLS_CERTIFICATE_FILE: /tmp/cert.pem
          TLS_PRIVATE_KEY_FILE: /tmp/other-key.pem
          TLS_CA_CERTIFICATE_FILE: /tmp/ca.pem
          DRY_RUN: "true"
          ROUTE_OUT: /tmp/route-mismatch.yml
        run: |
          if ./fixture/route-tls/provision.sh; then
            echo "expected cert/key mismatch to fail"
            exit 1
          fi

      - name: Script rejects wrong CA
        env:
          ROUTE_HOST: myapp.bcgov.ca
          ROUTE_NAME: my-test-route
          TARGET_SERVICE: my-test-service
          TLS_CERTIFICATE_FILE: /tmp/cert.pem
          TLS_PRIVATE_KEY_FILE: /tmp/key.pem
          TLS_CA_CERTIFICATE_FILE: /tmp/other.pem
          DRY_RUN: "true"
          ROUTE_OUT: /tmp/route-ca.yml
        run: |
          if ./fixture/route-tls/provision.sh; then
            echo "expected CA mismatch to fail"
            exit 1
          fi

      - name: Script rejects host mismatch
        env:
          ROUTE_HOST: wrong.example
          ROUTE_NAME: my-test-route
          TARGET_SERVICE: my-test-service
          TLS_CERTIFICATE_FILE: /tmp/cert.pem
          TLS_PRIVATE_KEY_FILE: /tmp/key.pem
          TLS_CA_CERTIFICATE_FILE: /tmp/ca.pem
          DRY_RUN: "true"
          ROUTE_OUT: /tmp/route-host.yml
        run: |
          if ./fixture/route-tls/provision.sh; then
            echo "expected host mismatch to fail"
            exit 1
          fi

      - name: Quarantine root workspace
        run: |
          set -euo pipefail
          rm -rf fixture
          echo "Root workspace quarantined. Current contents:"
          ls -la

      - name: Composite action dry-run
        uses: $/route-tls
        with:
          hostname: myapp.bcgov.ca
          target_service: my-test-service
          tls_certificate: ${{ env.DUMMY_CERT }}
          tls_private_key: ${{ env.DUMMY_KEY }}
          tls_ca_certificate: ${{ env.DUMMY_CA }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          dry_run: "true"

  test-fork-token-degradation:
    name: Fork Token Degradation Matrix (${{ matrix.scenario.name }})
    permissions: read-all
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        scenario:
          - name: route-tls-isolated
            type: composite-action
          - name: pr-description-write-noop
            type: write-noop-harness
            operation: pr-description
          - name: image-tracker-write-noop
            type: write-noop-harness
            operation: image-tracker
    steps:
      - name: Quarantine root workspace
        run: |
          set -euo pipefail
          echo "Ensuring root workspace is clean and isolated..."
          rm -rf ./* ./.* 2>/dev/null || true
          ls -la

      - name: Verify read-all token restrictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Simulating fork PR token degradation..."
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is missing in fork permutation"
            exit 1
          fi
          echo "Verified GITHUB_TOKEN is available under read-all permutation."

      - name: Exercise representative write/no-op harness
        if: matrix.scenario.type == 'write-noop-harness'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ matrix.scenario.operation }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || 1 }}
        run: |
          set -euo pipefail
          echo "Exercising write-capable operation '${OPERATION}' with read-only GITHUB_TOKEN..."

          case "${OPERATION}" in
            pr-description)
              API_PATH="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
              PAYLOAD='{"body":"test fork token degradation"}'
              ;;
            image-tracker)
              API_PATH="repos/${GITHUB_REPOSITORY}/releases"
              PAYLOAD='{"tag_name":"test-token-degradation-simulation","name":"test"}'
              ;;
            *)
              echo "::error::Unknown operation: ${OPERATION}"
              exit 1
              ;;
          esac

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/${API_PATH}" \
            -d "${PAYLOAD}" || true)

          echo "GitHub API responded with HTTP ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" = "403" ]; then
            echo "::notice::[${OPERATION}] Confirmed 403 Forbidden under permissions: read-all."
            echo "::notice::[${OPERATION}] Degrading gracefully: write skipped on read-only fork token without crashing."
            # Graceful degradation: exit 0 without crashing the pipeline
            exit 0
          elif [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "201" ]; then
            echo "::notice::[${OPERATION}] Write operation succeeded (elevated token present)."
            exit 0
          else
            echo "::error::[${OPERATION}] Unexpected HTTP ${HTTP_STATUS} received:"
            cat "$RESPONSE_FILE"
            exit 1
          fi

      - name: Generate dummy certificates
        if: matrix.scenario.type == 'composite-action'
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/fork-key.pem -out /tmp/fork-cert.pem \
            -days 30 -nodes -subj "/CN=myapp.bcgov.ca" \
            -addext "subjectAltName=DNS:myapp.bcgov.ca"
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/fork-other-key.pem -out /tmp/fork-other.pem \
            -days 30 -nodes -subj "/CN=other.example"
          cp /tmp/fork-cert.pem /tmp/fork-ca.pem
          {
            echo "FORK_CERT<<EOF"
            cat /tmp/fork-cert.pem
            echo "EOF"
            echo "FORK_KEY<<EOF"
            cat /tmp/fork-key.pem
            echo "EOF"
            echo "FORK_CA<<EOF"
            cat /tmp/fork-ca.pem
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Composite action dry-run (quarantined workspace)
        if: matrix.scenario.type == 'composite-action'
        uses: $/route-tls
        with:
          hostname: myapp.bcgov.ca
          target_service: my-test-service
          tls_certificate: ${{ env.FORK_CERT }}
          tls_private_key: ${{ env.FORK_KEY }}
          tls_ca_certificate: ${{ env.FORK_CA }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          dry_run: "true"

      - name: Validate generated route output
        if: matrix.scenario.type == 'composite-action'
        run: |
          set -euo pipefail
          [ -f route.yml ] || { echo "::error::route.yml was not created"; exit 1; }
          grep -q '^apiVersion: route.openshift.io/v1' route.yml
          grep -q '^kind: Route' route.yml
          echo "Route TLS composite action executed cleanly under fork token degradation."
