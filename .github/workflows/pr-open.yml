name: PR

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Keyed by event and PR number, not ref: a merged PR's close event runs with
  # ref refs/heads/main and would otherwise cancel the push-to-main run
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$(pwd)":/repo -w /repo rhysd/actionlint:latest

      - name: Audit composite actions for script injection
        run: python3 scripts/audit_composite_actions.py

      # actionlint only shellchecks workflow run: blocks; crunchy/ is owned separately
      - name: ShellCheck scripts
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -not -path './crunchy/*' -print0 \
            | sort -z | xargs -0 shellcheck --severity=warning

      - name: ShellCheck composite action bash
        run: python3 scripts/shellcheck_composite_actions.py

      - name: Verify sibling calls use $/
        run: |
          set -euo pipefail
          echo "Verifying composite actions do not use relative path './' for sibling calls..."
          if grep -rnE 'uses:\s*\./' ./*/action.yml; then
            echo "::error::Relative path './' found in action.yml. Sibling actions must be called using '$/<action>'."
            exit 1
          fi
          echo "Checking sibling action references..."
          for action in cert-keeper cleanup-pr image-import; do
            if ! grep -q 'uses: \$/oc-runner' "$action/action.yml"; then
              echo "::error::$action/action.yml must reference oc-runner via 'uses: $/oc-runner'"
              exit 1
            fi
          done
          echo "All sibling action references verified to use '$/'."

  # Path filter for repo-level probe summary tests
  changes:
    name: Path filters
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      probe_summary: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          base: ${{ steps.base.outputs.sha || github.event.before }}
          triggers: |
            .github/scripts/summarize-probe-results.sh
            .github/tests/probe-runner/
            .github/workflows/probe-runner-reachability.yml
            .github/workflows/pr-open.yml
            !*.md

  test-fork-token-degradation:
    name: Fork Token Degradation Matrix (${{ matrix.scenario.name }})
    permissions: read-all
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        scenario:
          - name: pr-description-write-noop
            type: write-noop-harness
            operation: pr-description
          - name: image-tracker-write-noop
            type: write-noop-harness
            operation: image-tracker
    steps:
      - name: Quarantine root workspace
        run: |
          set -euo pipefail
          echo "Ensuring root workspace is clean and isolated..."
          rm -rf ./* ./.* 2>/dev/null || true
          ls -la

      - name: Verify read-all token restrictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Simulating fork PR token degradation..."
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is missing in fork permutation"
            exit 1
          fi
          echo "Verified GITHUB_TOKEN is available under read-all permutation."

      - name: Exercise representative write/no-op harness
        if: matrix.scenario.type == 'write-noop-harness'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ matrix.scenario.operation }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || 1 }}
        run: |
          set -euo pipefail
          echo "Exercising write-capable operation '${OPERATION}' with read-only GITHUB_TOKEN..."

          case "${OPERATION}" in
            pr-description)
              API_PATH="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
              PAYLOAD='{"body":"test fork token degradation"}'
              ;;
            image-tracker)
              API_PATH="repos/${GITHUB_REPOSITORY}/releases"
              PAYLOAD='{"tag_name":"test-token-degradation-simulation","name":"test"}'
              ;;
            *)
              echo "::error::Unknown operation: ${OPERATION}"
              exit 1
              ;;
          esac

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/${API_PATH}" \
            -d "${PAYLOAD}" || true)

          echo "GitHub API responded with HTTP ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" = "403" ]; then
            echo "::notice::[${OPERATION}] Confirmed 403 Forbidden under permissions: read-all."
            echo "::notice::[${OPERATION}] Degrading gracefully: write skipped on read-only fork token without crashing."
            # Graceful degradation: exit 0 without crashing the pipeline
            exit 0
          elif [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "201" ]; then
            echo "::notice::[${OPERATION}] Write operation succeeded (elevated token present)."
            exit 0
          else
            echo "::error::[${OPERATION}] Unexpected HTTP ${HTTP_STATUS} received:"
            cat "$RESPONSE_FILE"
            exit 1
          fi

  # GitHub only warns on undeclared `with:` keys; these must fail at the input check
  test-unknown-inputs:
    name: Test Unknown Inputs Fail Loud
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same enforcer the actions pin, for its CLI
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bcgov/actions
          ref: d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
          path: .input-enforcer
          persist-credentials: false

      - name: oc-runner with undeclared verbose / diff_branch
        id: oc_runner
        continue-on-error: true
        uses: $/oc-runner
        with:
          oc_namespace: none
          oc_server: https://example.invalid:6443
          oc_token: none
          commands: oc version
          # Nonmatching trigger skips login, so only input rejection can fail this
          triggers: ./no-such-path/
          verbose: true
          diff_branch: main

      - name: cert-keeper with unknown key
        id: cert_keeper
        continue-on-error: true
        uses: $/cert-keeper
        with:
          hostname: example.com
          email: ops@example.com
          route_name: example
          target_service: example
          oc_namespace: none
          oc_server: https://example.invalid:6443
          oc_token: none
          not_an_input: x

      - name: Require failures
        env:
          OC_RUNNER: ${{ steps.oc_runner.outcome }}
          CERT_KEEPER: ${{ steps.cert_keeper.outcome }}
        run: |
          echo "oc-runner=$OC_RUNNER cert-keeper=$CERT_KEEPER"
          [ "$OC_RUNNER" = failure ] && [ "$CERT_KEEPER" = failure ] || {
            echo "::error::An action accepted an undeclared input"; exit 1; }

      # The failures above must be the unknown-input diagnostic: run the same
      # check for every action, with its declared inputs plus one extra key.
      - name: Require unknown-input diagnostic (every action)
        run: |
          enforce=.input-enforcer/input-enforcer/enforce.js
          fail=0
          for yml in */action.yml; do
            dir=${yml%/action.yml}
            json=$(node -e 'const {declaredInputs}=require(process.argv[2]);const o={};for(const k of declaredInputs(require("fs").readFileSync(process.argv[1],"utf8")))o[k]="x";o.not_an_input="x";console.log(JSON.stringify(o))' "$yml" "./$enforce")
            if out=$(node "$enforce" "$dir" "$json" 2>&1); then
              echo "::error::$dir accepted not_an_input"; fail=1; continue
            fi
            case "$out" in
              "::error title=$dir: unknown input::Unknown input(s) for $dir: not_an_input%0A"*"not_an_input: not an input of $dir"*"bcgov/actions-openshift/blob/main/$dir/README.md"*) echo "ok $dir" ;;
              *) echo "::error::$dir: wrong diagnostic"; printf '%s\n' "$out" | sed 's/::/: :/g'; fail=1 ;;
            esac
          done
          exit $fail

  # Fixture test of the Probe Runner Reachability Summary script.
  test-probe-summary:
    name: Test Probe Summary
    needs: changes
    if: needs.changes.outputs.probe_summary == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Summarize fixtures (bats)
        run: |
          set -euo pipefail
          command -v bats >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bats; }
          bats .github/tests/probe-runner/summarize.bats

  # Single merge gate for this workflow. Skipped jobs count as passing, so path-filtered
  # and same-repo-only jobs still let it report; it fails on any failed or cancelled job.
  results:
    name: PR Results
    needs:
      - actionlint
      - changes
      - test-fork-token-degradation
      - test-unknown-inputs
      - test-probe-summary
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
