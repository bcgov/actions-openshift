name: PR Environment Cleanup Tests

# Unit tests for pr-env-cleanup/purge.sh.
# Always runs on pull requests and main pushes so PR Environment Cleanup Results reports;
# the test job runs only when pr-env-cleanup or its dependencies changed (Markdown excluded).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  changes:
    name: PR Environment Cleanup (changes)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@6c8ac0469fcf0d826533bc526c90119b8f149884 # v0.13.0
        with:
          base: ${{ steps.base.outputs.sha || github.event.before }}
          triggers: |
            pr-env-cleanup/action.yml
            pr-env-cleanup/purge.sh
            crunchy/scripts/user_change.sh
            shared/inputs.sh
            oc-runner/action.yml
            oc-runner/scripts/
            .github/tests/pr-env-cleanup/
            .github/workflows/pr-env-cleanup-tests.yml
            !*.md

  unit:
    name: Test pr-env-cleanup (bats)
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (bats)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats parallel
          bats --jobs 2 .github/tests/pr-env-cleanup

  # Merge gate for this workflow: always reports, skipped jobs count as passing
  results:
    name: PR Environment Cleanup Results
    needs:
      - changes
      - unit
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@6c8ac0469fcf0d826533bc526c90119b8f149884 # v0.13.0
        with:
          needs: ${{ toJson(needs) }}
