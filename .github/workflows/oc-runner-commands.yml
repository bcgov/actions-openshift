name: oc-runner commands

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  changes:
    name: oc-runner (changes)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@0ed2b82c50ba113304b3b879e1dc7b9ea087d0fe # v0.15.0
        with:
          base: ${{ steps.base.outputs.sha || github.event.before }}
          triggers: |
            oc-runner/
            shared/
            cert-keeper/action.yml
            cert-keeper/check.sh
            cleanup-pr/action.yml
            sysdig-monitor/action.yml
            .github/tests/oc-runner/
            .github/tests/shared/
            .github/workflows/oc-runner-commands.yml
            !*.md

  commands:
    name: Test oc-runner commands
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Unit tests (bats, 2 workers)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats parallel
          bats --jobs 2 .github/tests/oc-runner .github/tests/shared

  unreachable-api:
    name: Test oc-runner blocked output
    needs: changes
    if: needs.changes.outputs.triggered == 'true'
    # No credentials: silver's API name points at a non-routable address on this runner, so
    # pre-flight times out while the real silver router still answers. The action must fail
    # with blocked=true (unreachable=true if the router is down too), and the composite
    # outputs must survive the failed step
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Point the silver API at a non-routable address
        run: echo "10.255.255.1 api.silver.devops.gov.bc.ca" | sudo tee -a /etc/hosts

      - id: oc
        continue-on-error: true
        uses: $/oc-runner
        with:
          oc_namespace: abc123-dev
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          oc_token: not-a-real-token-not-a-real-token-0000

      - name: Check outcome and outputs
        env:
          OUTCOME: ${{ steps.oc.outcome }}
          BLOCKED: ${{ steps.oc.outputs.blocked }}
          UNREACHABLE: ${{ steps.oc.outputs.unreachable }}
        run: |
          echo "outcome=${OUTCOME} blocked=${BLOCKED} unreachable=${UNREACHABLE}"
          if [ "${OUTCOME}" != failure ]; then
            echo "::error::oc-runner should fail against a non-routable API"
            exit 1
          fi
          if [ "${BLOCKED}${UNREACHABLE}" != truefalse ] && [ "${BLOCKED}${UNREACHABLE}" != falsetrue ]; then
            echo "::error::Expected exactly one of blocked/unreachable to be true"
            exit 1
          fi

  connect-retry:
    name: Test oc-runner connect-timeout retry
    needs: changes
    # Needs OpenShift credentials: pushes and same-repo PRs only (forks have no OC_TOKEN)
    if: >-
      needs.changes.outputs.triggered == 'true'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    # Real login, then a block whose first run fails with a simulated API connect timeout
    # (marker file). oc-runner must run the whole block once more and pass on the retry's output
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: oc
        uses: $/oc-runner
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: |
            oc whoami
            runs_file="${RUNNER_TEMP}/connect-retry-runs"
            [ -e "$runs_file" ] || echo 0 > "$runs_file"
            runs=$(( $(cat "$runs_file") + 1 ))
            echo "$runs" > "$runs_file"
            if [ "$runs" -eq 1 ]; then
              echo "Unable to connect to the server: dial tcp 192.0.2.1:6443: i/o timeout (simulated)" >&2
              exit 1
            fi
            echo "runs=${runs}" >> "$GITHUB_OUTPUT"

      - name: Check the block ran twice
        env:
          COMMANDS_OUTPUT: ${{ steps.oc.outputs.commands }}
        run: |
          echo "commands output: ${COMMANDS_OUTPUT}"
          if [ "${COMMANDS_OUTPUT}" != "runs=2" ]; then
            echo "::error::Expected one retry after the simulated connect timeout (runs=2), got '${COMMANDS_OUTPUT}'"
            exit 1
          fi

  # Merge gate for this workflow: always reports, skipped jobs count as passing
  results:
    name: OC Runner Results
    needs:
      - changes
      - commands
      - unreachable-api
      - connect-retry
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@0ed2b82c50ba113304b3b879e1dc7b9ea087d0fe # v0.15.0
        with:
          needs: ${{ toJson(needs) }}
