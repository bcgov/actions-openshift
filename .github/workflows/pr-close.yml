name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # Shares the PR workflow's group so cleanup cancels any running test deploy
  group: PR-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup-deployer-test:
    name: Cleanup Deployer Test
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: $/cleanup-pr
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}

      - name: Delete image-import pull-request tag
        uses: $/oc-runner
        env:
          PR: ${{ github.event.number }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: |
            oc delete imagestreamtag "image-import:${PR}" --ignore-not-found
