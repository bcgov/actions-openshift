name: .PR Close

on:
  workflow_call:
    inputs:
      ### Typical / recommended
      cleanup:
        description: "Type of cleanup; e.g. helm or label"
        required: false
        type: string
      environment:
        description: Environment name; omit for PRs
        required: false
        type: string
      packages:
        description: "Packages to promote, one per line or a single package"
        required: false
        type: string
      remove_pvc:
        required: false
        default: data-${{ github.event.repository.name }}-${{ github.event.number }}-bitnami-pg-0
        type: string
        description: "PVCs to remove, one per line or a single PVC"

      ### Usually a bad idea / not recommended
      merge_branch:
        description: "Merge target branch"
        required: false
        type: string
        default: ${{ github.event.repository.default_branch }}
      cleanup_name:
        description: "Use if template/cleanup name differs from repo; one name per line, or a single name"
        type: string
        default: ""
      organization:
        description: "GitHub organization; e.g. bcgov"
        default: ${{ github.repository_owner }}
        required: false
        type: string
      repository:
        description: "GitHub repository, e.g. quickstart-openshift"
        default: ${{ github.event.repository.name }}
        required: false
        type: string
      tag_promote:
        description: "Tag to promote to; e.g. latest, test, demo or prod"
        default: latest
        required: false
        type: string
      target:
        description: "Target; e.g. PR number, test or prod"
        default: ${{ github.event.number }}
        required: false
        type: string

    secrets:
      oc_namespace:
        description: "OpenShift namespace"
        required: false
      oc_token:
        description: "OpenShift token"
        required: false
      oc_server:
        description: "OpenShift server, defaults to https://api.silver.devops.gov.bc.ca:6443"
        required: false

env:
  DEFAULT_OC_SERVER: https://api.silver.devops.gov.bc.ca:6443

jobs:
  vars:
    if: inputs.packages != ''
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - id: packages
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          # One package per line, or a single package; outer quotes stripped (same rules as shared/inputs.sh;
          # a reusable workflow can't read files from this repository)
          packages=$(jq -cRn '[inputs | gsub("^\\s+|\\s+$"; "") | sub("^(?<q>[\"'"'"'])(?<v>.*)\\k<q>$"; "\(.v)") | select(. != "")]' <<< "$INPUT_PACKAGES")
          if jq -e 'any(.[]; test("[\\s,;\"'"'"'()\\[\\]]"))' <<< "$packages" > /dev/null; then
            echo "::error title=packages: list format::Invalid packages input: ${INPUT_PACKAGES//$'\n'/ }%0Apackages takes one item per line, or a single value.%0AUse:%0A  packages: |%0A    backend%0A    frontend%0AMultiline input syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepswith"
            exit 1
          fi
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

      - env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_BRANCH: ${{ inputs.merge_branch }}
        run: |
          # Diagnostic vars
          printf 'packages=%s\n' "${INPUT_PACKAGES//$'\n'/ }"
          echo "github.event.pull_request.merged=$PR_MERGED"
          echo "github.event.pull_request.base.ref=$PR_BASE_REF"
          echo "inputs.merge_branch=$MERGE_BRANCH"

  retags:
    name: Retags
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.merge_branch
    needs: vars
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.vars.outputs.packages) }}
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ inputs.organization }}/${{ inputs.repository }}/${{ matrix.package }}
          target: ${{ inputs.target }}
          tags: ${{ inputs.tag_promote }}

  # Clean up OpenShift when PR closed
  cleanup:
    name: OpenShift
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'closed' && (inputs.cleanup == 'helm' || inputs.cleanup == 'label')
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Cleanup OpenShift
        uses: $/cleanup-pr
        with:
          cleanup: ${{ inputs.cleanup }}
          cleanup_name: ${{ inputs.cleanup_name }}
          repository: ${{ inputs.repository }}
          target: ${{ inputs.target }}
          remove_pvc: ${{ inputs.remove_pvc }}
          oc_server: ${{ secrets.oc_server || env.DEFAULT_OC_SERVER }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}


