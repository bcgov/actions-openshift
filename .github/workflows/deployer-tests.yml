name: Deployer Tests

# OpenShift deployment and template-leak checks for deployer.
# Always runs on pull requests and main pushes so Deployer Results reports; the deploy
# matrix runs only on same-repo pull requests when deployer or its dependencies changed (Markdown excluded).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  changes:
    name: Deployer (changes)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      # diff-triggers compares against the base branch tip. The merge base keeps a
      # newer main change out of this pull request's diff. Pushes compare the whole pushed range.
      - name: Find the pull request merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge base for ${BASE_SHA}...${HEAD_SHA}"; exit 1; }
          echo "Merge base: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: diff
        uses: bcgov/actions/diff-triggers@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          base: ${{ steps.base.outputs.sha || github.event.before }}
          triggers: |
            deployer/action.yml
            deployer/templates/
            shared/inputs.sh
            oc-runner/action.yml
            oc-runner/scripts/
            .github/workflows/deployer-tests.yml
            .github/tests/deployer/
            !*.md

  test-deployer:
    name: Test Deployer (${{ matrix.name }})
    needs: changes
    # Needs OpenShift credentials: same-repo PRs only (fork and push events get none)
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.triggered == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name: [backend, database, frontend, multi]
        include:
          - name: backend
            file: deployer/templates/backend.yml
            overwrite: true
            # Fake secret for the leak check; & < $ get JSON-escaped, defeating log masking
            parameters: -p RANDOM_EXPRESSION='LeakCanary7f3a&x<y$z'
          - name: database
            file: deployer/templates/database.yml
            overwrite: false
          - name: frontend
            file: deployer/templates/frontend.yml
            oc_version: "4.13"
            overwrite: true
          - name: multi
            file: .github/tests/deployer/multi-deployment.yml
            overwrite: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Later pushes to the same PR reuse ZONE, so leftover Deployments would
      # turn the first overwrite=false run into an already-exists case.
      - name: Remove leftover test Deployments
        if: matrix.name == 'database' || matrix.name == 'multi'
        uses: $/oc-runner
        env:
          REPO: ${{ github.event.repository.name }}
          ZONE: ${{ github.event.number }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: |
            oc delete deployment "${REPO}-${ZONE}-database" --ignore-not-found
            oc delete deployment "${REPO}-${ZONE}-multi-a" --ignore-not-found
            oc delete deployment "${REPO}-${ZONE}-multi-b" --ignore-not-found

      - name: Deploy
        uses: $/deployer
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: ${{ matrix.oc_version }}
          overwrite: ${{ matrix.overwrite }}
          triggers: |
            deployer/
            oc-runner/
            shared/inputs.sh
            .github/workflows/deployer-tests.yml
            .github/tests/deployer/
          debug: true
          parameters: -p NAME=${{ github.event.repository.name }} -p ZONE=${{ github.event.number }} ${{ matrix.parameters }}

      # Second overwrite=false run: each Deployment already exists, so rollout
      # status must be skipped rather than waiting on the existing object.
      - name: Deploy existing objects without overwrite
        if: matrix.name == 'database' || matrix.name == 'multi'
        uses: $/deployer
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_version: ${{ matrix.oc_version }}
          overwrite: false
          triggers: |
            deployer/
            oc-runner/
            shared/inputs.sh
            .github/workflows/deployer-tests.yml
            .github/tests/deployer/
          debug: true
          parameters: -p NAME=${{ github.event.repository.name }} -p ZONE=${{ github.event.number }} ${{ matrix.parameters }}

      - name: Check rendered template did not leak
        env:
          CANARY: LeakCanary7f3a
        run: |
          set -euo pipefail
          if [ -n "${TEMPLATE+x}" ]; then
            echo "::error::TEMPLATE env var is visible to later steps"
            exit 1
          fi
          if env | grep -v '^CANARY=' | grep -qF "${CANARY}"; then
            echo "::error::Template content found in the job environment"
            exit 1
          fi
          # GITHUB_ENV/GITHUB_OUTPUT files of earlier steps sit next to this step's
          if grep -rqF "${CANARY}" "$(dirname "${GITHUB_ENV}")"; then
            echo "::error::Template content was written to a GITHUB_ENV/GITHUB_OUTPUT file"
            exit 1
          fi
          if compgen -G "${RUNNER_TEMP}/deployer-template*" > /dev/null; then
            echo "::error::Rendered template file was not removed"
            exit 1
          fi
          echo "No template leak found"

  confirm-rollout-skip:
    name: Confirm rollout skip
    needs: [changes, test-deployer]
    if: >-
      !cancelled()
      && needs.changes.outputs.triggered == 'true'
      && needs.test-deployer.result == 'success'
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Existing deployment skips rollout status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --paginate \
            --jq '.jobs[] | "\(.id)\t\(.name)\t\(.conclusion)"')"

          plain_log() {
            local name="$1" dest="$2" job_id conclusion
            job_id="$(awk -F'\t' -v n="$name" '$2 == n { print $1 }' <<< "$jobs")"
            conclusion="$(awk -F'\t' -v n="$name" '$2 == n { print $3 }' <<< "$jobs")"
            [ -n "$job_id" ] || { echo "::error::${name} job not found"; exit 1; }
            [ "$conclusion" = "success" ] || { echo "::error::${name} conclusion is ${conclusion}"; exit 1; }
            gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "${dest}.raw"
            [ -s "${dest}.raw" ] || { echo "::error::${name} log is empty"; exit 1; }
            # Raw logs hold ANSI colour codes; match against a stripped copy, never print it
            sed -E 's/\x1b\[[0-9;]*m//g; s/^[0-9T:.-]+Z //' "${dest}.raw" > "$dest"
          }

          count() {
            # $1 = file, $2 = regex; print match count
            grep -cE "$2" "$1" || true
          }

          failed=0
          db="${RUNNER_TEMP}/database.plain"
          be="${RUNNER_TEMP}/backend.plain"
          fe="${RUNNER_TEMP}/frontend.plain"
          multi="${RUNNER_TEMP}/multi.plain"
          plain_log "Test Deployer (database)" "$db"
          plain_log "Test Deployer (backend)" "$be"
          plain_log "Test Deployer (frontend)" "$fe"
          plain_log "Test Deployer (multi)" "$multi"

          skip_re='^Overwrite=false; Deployment [^[:space:]]+ already exists; skipping rollout status$'
          created_re='^deployment\.apps/[^[:space:]]+ created$'
          db_created="$(count "$db" "$created_re")"
          db_skip="$(count "$db" "$skip_re")"
          db_rolled="$(count "$db" 'successfully rolled out')"
          multi_created="$(count "$multi" "$created_re")"
          multi_skip="$(count "$multi" "$skip_re")"
          multi_rolled="$(count "$multi" 'successfully rolled out')"
          be_rolled="$(count "$be" 'successfully rolled out')"
          fe_rolled="$(count "$fe" 'successfully rolled out')"
          be_apply="$(count "$be" '^Overwrite=true; using oc apply$')"
          fe_apply="$(count "$fe" '^Overwrite=true; using oc apply$')"

          check() {
            local label="$1" ok="$2" detail="$3"
            if [ "$ok" = "1" ]; then
              echo "PASS: ${label}: ${detail}"
            else
              echo "::error::${label}: ${detail}"
              failed=1
            fi
          }

          # First overwrite=false run creates the Deployment and follows its rollout.
          # Shared NetworkPolicies may already exist; that must not skip the wait.
          check "database create followed rollout" \
            "$( [ "$db_created" -ge 1 ] && [ "$db_rolled" -eq 1 ] && echo 1 || echo 0 )" \
            "created=${db_created} successfully-rolled-out=${db_rolled} (want created>=1, rolled-out=1)"
          # Second overwrite=false run finds the Deployment already present and skips.
          check "database existing deploy skipped rollout" \
            "$( [ "$db_skip" -eq 1 ] && echo 1 || echo 0 )" \
            "skip-log=${db_skip} (want 1)"
          # Two-Deployment template: both are created and followed, then both skipped.
          check "multi create followed both rollouts" \
            "$( [ "$multi_created" -eq 2 ] && [ "$multi_rolled" -eq 2 ] && echo 1 || echo 0 )" \
            "created=${multi_created} successfully-rolled-out=${multi_rolled} (want created=2, rolled-out=2)"
          check "multi existing deploy skipped both rollouts" \
            "$( [ "$multi_skip" -eq 2 ] && echo 1 || echo 0 )" \
            "skip-log=${multi_skip} (want 2)"
          # Apply path still follows rollouts.
          check "backend apply followed rollout" \
            "$( [ "$be_apply" -ge 1 ] && [ "$be_rolled" -ge 1 ] && echo 1 || echo 0 )" \
            "apply=${be_apply} successfully-rolled-out=${be_rolled}"
          check "frontend apply followed rollout" \
            "$( [ "$fe_apply" -ge 1 ] && [ "$fe_rolled" -ge 1 ] && echo 1 || echo 0 )" \
            "apply=${fe_apply} successfully-rolled-out=${fe_rolled}"

          exit "$failed"

  # Merge gate for this workflow: always reports, skipped jobs count as passing
  results:
    name: Deployer Results
    needs:
      - changes
      - test-deployer
      - confirm-rollout-skip
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/workflow-results@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          needs: ${{ toJson(needs) }}
