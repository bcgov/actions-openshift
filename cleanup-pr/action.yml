name: "PR Cleanup"
description: "Cleans up Helm releases, labeled resources, and PVCs in a target OpenShift namespace"

inputs:
  cleanup:
    description: "Type of cleanup: helm or label"
    required: false
    default: "label"
  cleanup_name:
    description: "app label values to clean up: one per line, comma separated, or a JSON array (defaults to repository-target)"
    required: false
    default: ""
  repository:
    description: "GitHub repository name"
    required: false
    default: ${{ github.event.repository.name }}
  target:
    description: "Target environment identifier (e.g. PR number)"
    required: false
    default: ${{ github.event.number }}
  remove_pvc:
    description: "PVCs to remove: one per line, comma separated, or a JSON array"
    required: false
    default: ""
  oc_server:
    description: "OpenShift server URL with port (e.g. https://api.silver.devops.gov.bc.ca:6443)"
    required: true
  oc_namespace:
    description: "OpenShift namespace"
    required: true
  oc_token:
    description: "OpenShift token"
    required: true

runs:
  using: "composite"
  steps:
    # Shared input rules (shared/inputs.sh); a bad value fails here
    - name: Parse Inputs
      id: inputs
      shell: bash
      env:
        INPUT_CLEANUP: ${{ inputs.cleanup }}
        INPUT_CLEANUP_NAME: ${{ inputs.cleanup_name }}
        INPUT_REMOVE_PVC: ${{ inputs.remove_pvc }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.sh
      run: |
        # shellcheck source=/dev/null
        source "$SHARED_INPUTS"
        cleanup="$(input_enum cleanup "$INPUT_CLEANUP" "helm label" label)"
        names="$(input_list cleanup_name "$INPUT_CLEANUP_NAME")"
        pvcs="$(input_list remove_pvc "$INPUT_REMOVE_PVC")"
        {
          echo "cleanup=${cleanup}"
          printf 'cleanup_name<<EOF_NAMES\n%s\nEOF_NAMES\n' "$names"
          printf 'remove_pvc<<EOF_PVCS\n%s\nEOF_PVCS\n' "$pvcs"
        } >> "$GITHUB_OUTPUT"

    - name: Run Cleanup Commands
      uses: $/oc-runner
      env:
        CLEANUP: ${{ steps.inputs.outputs.cleanup }}
        CLEANUP_NAME: ${{ steps.inputs.outputs.cleanup_name }}
        REPOSITORY: ${{ inputs.repository }}
        TARGET: ${{ inputs.target }}
        REMOVE_PVC: ${{ steps.inputs.outputs.remove_pvc }}
      with:
        oc_namespace: ${{ inputs.oc_namespace }}
        oc_token: ${{ inputs.oc_token }}
        oc_server: ${{ inputs.oc_server }}
        commands: |
          # 1. Helm Cleanup
          if [ "$CLEANUP" = "helm" ]; then
            release="${REPOSITORY}-${TARGET}"
            echo "Attempting Helm uninstall for release: ${release}"
            if helm status "${release}" >/dev/null 2>&1; then
              helm uninstall --no-hooks "${release}"
            else
              echo "Not found: ${release}"
            fi
          fi

          # 2. Label Cleanup
          if [ "$CLEANUP" = "label" ]; then
            if [ -n "$CLEANUP_NAME" ]; then
              while IFS= read -r name; do
                [ -n "$name" ] || continue
                echo "Deleting resources for label: app=${name}"
                oc delete all,jobs,cronjobs,cm,pvc,secret,networkpolicy,routes,hpa -l "app=${name}" || echo "Not found: ${name}"
              done <<< "$CLEANUP_NAME"
            else
              target_label="${REPOSITORY}-${TARGET}"
              echo "Deleting resources for label: app=${target_label}"
              oc delete all,jobs,cronjobs,cm,pvc,secret,networkpolicy,routes,hpa -l "app=${target_label}" || echo "Not found: ${target_label}"
            fi
          fi

          # 3. Remove PVCs
          if [ -n "$REMOVE_PVC" ]; then
            while IFS= read -r pvc; do
              [ -n "$pvc" ] || continue
              echo "Deleting PVC: ${pvc}"
              oc delete pvc "$pvc" || echo "Not found: $pvc"
            done <<< "$REMOVE_PVC"
          fi
