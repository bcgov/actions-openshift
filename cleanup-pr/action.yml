name: "PR Cleanup"
description: "Cleans up Helm releases, labeled resources, and PVCs in a target OpenShift namespace"

inputs:
  cleanup:
    description: "Type of cleanup; e.g. helm or label"
    required: false
    default: "label"
  cleanup_name:
    description: "Cleanup label app name (defaults to repository-target)"
    required: false
    default: ""
  repository:
    description: "GitHub repository name"
    required: false
    default: ${{ github.event.repository.name }}
  target:
    description: "Target environment identifier (e.g. PR number)"
    required: false
    default: ${{ github.event.number }}
  remove_pvc:
    description: "Comma-separated list of PVCs to remove"
    required: false
    default: ""
  oc_server:
    description: "OpenShift server"
    required: false
    default: "https://api.silver.devops.gov.bc.ca:6443"
  oc_namespace:
    description: "OpenShift namespace"
    required: true
  oc_token:
    description: "OpenShift token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run Cleanup Commands
      uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
      with:
        oc_namespace: ${{ inputs.oc_namespace }}
        oc_token: ${{ inputs.oc_token }}
        oc_server: ${{ inputs.oc_server }}
        commands: |
          # 1. Helm Cleanup
          if [ "${{ inputs.cleanup }}" = "helm" ]; then
            release="${{ inputs.repository }}-${{ inputs.target }}"
            echo "Attempting Helm uninstall for release: ${release}"
            helm status "$release" >/dev/null 2>&1 && helm uninstall --no-hooks "$release" || echo "Not found: $release"
          fi

          # 2. Label Cleanup
          if [ "${{ inputs.cleanup }}" = "label" ]; then
            if [ -n "${{ inputs.cleanup_name }}" ]; then
              for name in ${{ inputs.cleanup_name }}; do
                echo "Deleting resources for label: app=${name}"
                oc delete deployments,statefulsets,jobs,cronjobs,services,routes,cm,pvc,secret,networkpolicy,hpa,pods -l app="${name}" || echo "Not found: ${name}"
              done
            else
              target_label="${{ inputs.repository }}-${{ inputs.target }}"
              echo "Deleting resources for label: app=${target_label}"
              oc delete deployments,statefulsets,jobs,cronjobs,services,routes,cm,pvc,secret,networkpolicy,hpa,pods -l app="${target_label}" || echo "Not found: ${target_label}"
            fi
          fi

          # 3. Remove PVCs
          if [ -n "${{ inputs.remove_pvc }}" ]; then
            for pvc in $(echo "${{ inputs.remove_pvc }}" | tr ',' ' '); do
              echo "Deleting PVC: ${pvc}"
              oc delete pvc "$pvc" || echo "Not found: $pvc"
            done
          fi
