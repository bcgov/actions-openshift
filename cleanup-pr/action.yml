name: "PR Cleanup"
description: "Cleans up Helm releases, labeled resources, and PVCs in a target OpenShift namespace"

inputs:
  cleanup:
    description: "Type of cleanup; e.g. helm or label"
    required: false
    default: "label"
  cleanup_name:
    description: "Cleanup label app name (defaults to repository-target)"
    required: false
    default: ""
  repository:
    description: "GitHub repository name"
    required: false
    default: ${{ github.event.repository.name }}
  target:
    description: "Target environment identifier (e.g. PR number)"
    required: false
    default: ${{ github.event.number }}
  remove_pvc:
    description: "Comma-separated list of PVCs to remove"
    required: false
    default: ""
  oc_server:
    description: "OpenShift server"
    required: false
    default: "https://api.silver.devops.gov.bc.ca:6443"
  oc_namespace:
    description: "OpenShift namespace"
    required: true
  oc_token:
    description: "OpenShift token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run Cleanup Commands
      uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
      env:
        CLEANUP: ${{ inputs.cleanup }}
        CLEANUP_NAME: ${{ inputs.cleanup_name }}
        REPOSITORY: ${{ inputs.repository }}
        TARGET: ${{ inputs.target }}
        REMOVE_PVC: ${{ inputs.remove_pvc }}
      with:
        oc_namespace: ${{ inputs.oc_namespace }}
        oc_token: ${{ inputs.oc_token }}
        oc_server: ${{ inputs.oc_server }}
        commands: |
          # 1. Helm Cleanup
          if [ "$CLEANUP" = "helm" ]; then
            release="${REPOSITORY}-${TARGET}"
            echo "Attempting Helm uninstall for release: ${release}"
            helm status "$release" >/dev/null 2>&1 && helm uninstall --no-hooks "$release" || echo "Not found: $release"
          fi

          # 2. Label Cleanup
          if [ "$CLEANUP" = "label" ]; then
            if [ -n "$CLEANUP_NAME" ]; then
              for name in $CLEANUP_NAME; do
                echo "Deleting resources for label: app=${name}"
                oc delete deployments,statefulsets,daemonsets,replicasets,jobs,cronjobs,services,routes,cm,pvc,secret,networkpolicy,hpa,pods -l app="${name}" || echo "Not found: ${name}"
              done
            else
              target_label="${REPOSITORY}-${TARGET}"
              echo "Deleting resources for label: app=${target_label}"
              oc delete deployments,statefulsets,daemonsets,replicasets,jobs,cronjobs,services,routes,cm,pvc,secret,networkpolicy,hpa,pods -l app="${target_label}" || echo "Not found: ${target_label}"
            fi
          fi

          # 3. Remove PVCs
          if [ -n "$REMOVE_PVC" ]; then
            for pvc in $(echo "$REMOVE_PVC" | tr ',' ' '); do
              echo "Deleting PVC: ${pvc}"
              oc delete pvc "$pvc" || echo "Not found: $pvc"
            done
          fi
