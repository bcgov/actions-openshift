name: OpenShift CLI (oc) Login and Runner
description: |
  Action for running OpenShift (oc) commands and managing cronjobs.
  Supports conditional execution based on file changes and provides detailed logging.
branding:
  icon: package
  color: blue

inputs:
  ### Required
  oc_namespace:
    description: |
      OpenShift namespace
      Example: abc123-dev, abc123-test, abc123-prod
    required: true
    pattern: "^[a-z0-9]{6}-(dev|test|prod|tools)$"
  oc_server:
    description: |
      OpenShift server URL with port
      Example: https://api.silver.devops.gov.bc.ca:6443
    required: true
    pattern: '^https:\/\/.*:6443$'
  oc_token:
    description: |
      OpenShift access token for authentication
      Should be stored as a GitHub secret
    required: true
    minLength: 32

  ### Typical / recommended
  commands:
    description: |
      Commands to run (generally oc commands)
      Example: oc whoami
  cronjob:
    description: |
      Name of the cronjob to execute and monitor
      Example: nr-repository-name-cronjob-component
  triggers:
    description: |
      Omit to always run, otherwise trigger by path (one path per line).
      Example:
        triggers: |
          ./common/
          ./backend/
          ./frontend/

  ### Usually a bad idea / not recommended
  cronjob_tail:
    description: |
      Number of cronjob log lines to tail; use -1 for all
      Example: 100, 200, -1
    default: -1
    # pattern accepts -1 or any non-negative integer
    pattern: "^(-1|[0-9]+)$"
  diff_base:
    description: |
      Base to diff triggers against (bcgov/actions diff-triggers diff_base)
      Example: main, master, SHA or tag
    default: ${{ github.event.repository.default_branch }}
  oc_version:
    description: |
      Override oc version, >= 4.0
      Example: 4.18
    default: "4.18"
    pattern: '^4\.[0-9]+$'
  repository:
    description: |
      Optionally, specify a different repo to clone
      Example: bcgov/openshift-quickstart
    default: ""
    pattern: "^[a-zA-Z0-9-_]+/[a-zA-Z0-9-_]+$"
  ref:
    # This should usually be empty unless we're overriding the current branch
    description: |
      The branch, tag or SHA to checkout; omit to use the current branch
      Example: main, master, SHA or tag
    default: ""
  timeout:
    description: |
      Timeout for the commands block and the cronjob wait
      Example: 10m, 30s, 1h
    default: 10m
    pattern: "^[0-9]+[mhs]$"
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
  debug:
    description: |
      Enable bash xtrace (`set -x`) for the commands block. Also on when the run is re-run with debug logging.
      Example: true, false
    default: "false"

outputs:
  commands:
    description: |
      Generic output channel for data produced by the commands step.
      Typically populated via $GITHUB_OUTPUT in the commands step and may be empty
      if no commands are run or the commands step does not execute.
    value: ${{ steps.commands.outputs.commands }}
  job_name:
    description: Name of the job created from the cronjob param
    value: ${{ steps.cronjob.outputs.job_name }}
  triggered:
    description: Whether the action was triggered
    value: ${{ steps.diff.outputs.triggered }}
  blocked:
    description: |
      'true' when login failed because this runner's IP is blocked from the OpenShift API (the cluster router answered).
      Not a code problem; re-running the job usually lands on another runner.
    value: ${{ steps.login.outputs.blocked }}
  unreachable:
    description: |
      'true' when login failed because neither the OpenShift API nor the cluster router answered (outage).
    value: ${{ steps.login.outputs.unreachable }}


runs:
  using: composite
  steps:
    # Shared input rules (shared/inputs.sh); a bad value fails here
    - name: Parse Inputs
      id: inputs
      shell: bash
      env:
        INPUT_DEBUG: ${{ inputs.debug }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.sh
      run: |
        # shellcheck source=/dev/null
        source "$SHARED_INPUTS"
        debug="$(input_debug "$INPUT_DEBUG")"
        echo "debug=${debug}" >> "$GITHUB_OUTPUT"

    # Send triggers to diff action (diff-triggers v0.9.0 still names its input ref)
    - id: diff
      uses: bcgov/actions/diff-triggers@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
      with:
        triggers: ${{ inputs.triggers }}
        ref: ${{ inputs.diff_base }}

    - name: Cache OpenShift CLI
      if: steps.diff.outputs.triggered == 'true' && inputs.oc_version != 'latest'
      uses: actions/cache@v6
      with:
        path: /usr/local/bin/oc
        key: oc-cli-stable-${{ inputs.oc_version }}-${{ runner.os }}-${{ runner.arch }}

    - if: steps.diff.outputs.triggered == 'true'
      id: login
      env:
        OC: ${{ format('stable-{0}', inputs.oc_version) }}
        SERVER_URL: ${{ inputs.oc_server }}
        NAMESPACE: ${{ inputs.oc_namespace }}
        TOKEN_INPUT: ${{ inputs.oc_token }}
        ACTION_PATH: ${{ github.action_path }}
      shell: bash
      working-directory: /usr/local/bin
      run: |
        # Input gate, API pre-flight, oc install and login; reports blocked runner IPs and outages
        "${ACTION_PATH}/scripts/login.sh"

    - if: steps.diff.outputs.triggered == 'true'
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}

    - if: steps.diff.outputs.triggered == 'true' && inputs.commands
      id: commands
      shell: bash
      env:
        COMMANDS: ${{ inputs.commands }}
        COMMANDS_TIMEOUT: ${{ inputs.timeout }}
        DEBUG: ${{ steps.inputs.outputs.debug }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        "${ACTION_PATH}/scripts/run_commands.sh"

    - if: steps.diff.outputs.triggered == 'true' && inputs.commands && inputs.cronjob
      shell: bash
      run: sleep 3

    # Restore the caller workspace if we checked out a different repository.
    - if: steps.diff.outputs.triggered == 'true' && inputs.repository != ''
      name: Restore caller checkout
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.token }}

    - if: steps.diff.outputs.triggered == 'true' && inputs.cronjob
      id: cronjob
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CRONJOB: ${{ inputs.cronjob }}
        TIMEOUT: ${{ inputs.timeout }}
        CRONJOB_TAIL: ${{ inputs.cronjob_tail }}
      run: |
        # Run the cronjob script
        "${ACTION_PATH}/scripts/run_cronjob.sh" "${CRONJOB}" "${TIMEOUT}" "${CRONJOB_TAIL}"
