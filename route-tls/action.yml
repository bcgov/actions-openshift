# ==============================================================================
# ARCHITECTURE DECISION RECORD: DO NOT CONVERT THIS ACTION TO JAVASCRIPT
# ==============================================================================
# While BC Gov is standardizing on JavaScript/TypeScript for GitHub Actions,
# this specific action MUST remain a Composite Bash action.
#
# Rationale:
# 1. Cryptography: We rely on the natively-installed `openssl` binary for
#    public-key extraction and matching. Re-implementing this in Node.js
#    requires custom crypto libraries and PEM parsing, which is inherently
#    riskier and less audited than OpenSSL.
# 2. Kubernetes API: We rely on the `oc` binary. GitHub runners download it
#    from the OpenShift client mirror; laptops use a local install. We do
#    not use bcgov/action-oc-runner: that action logs in and checkouts, so
#    it needs oc_* in `with:` and a GITHUB_TOKEN with contents: read.
#    Re-implementing this in JS would require bundling
#    `@kubernetes/client-node` and reconstructing authentication that `oc`
#    already handles.
# 3. Local testing: the same bash (`provision.sh`) is the GitHub entrypoint
#    and the laptop dry-run path. A JS action would not be runnable with a
#    PEM on disk and no Node toolchain.
#
# For infrastructure CLI orchestration, Bash remains the superior and safer tool.
# ==============================================================================
name: "Route TLS"
description: "Applies an OpenShift Route with custom TLS (cert/key/CA), openssl checks, and archival backups."
inputs:
  hostname:
    description: "Route spec.host (e.g. myapp.gov.bc.ca). Hostname only, no scheme."
    required: true
  route_name:
    description: "OpenShift Route name. Defaults to <repository>-vanity-url so it is not swept up with app= label cleanup."
    required: false
    default: ${{ github.event.repository.name }}-vanity-url
  target_service:
    description: "The OpenShift Service to send traffic to"
    required: true
  tls_certificate:
    description: "The public TLS certificate PEM"
    required: true
  tls_private_key:
    description: "The private TLS key PEM"
    required: true
  tls_ca_certificate:
    description: "Issuing CA PEM (Entrust OV TLS Issuing RSA CA 2)"
    required: true
  oc_namespace:
    description: "OpenShift namespace. Required unless dry_run is true."
    required: false
    default: ""
  oc_server:
    description: "OpenShift API URL. Required unless dry_run is true."
    required: false
    default: ""
  oc_token:
    description: "OpenShift token. Required unless dry_run is true."
    required: false
    default: ""
  dry_run:
    description: "If true, skip the cluster: validate cert/key/host and write YAML only"
    required: false
    default: "false"
  insecure_skip_tls_verify:
    description: "If true, skip TLS verification when logging into the OpenShift API"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Apply route TLS
      shell: bash
      env:
        ROUTE_HOST: ${{ inputs.hostname }}
        ROUTE_NAME: ${{ inputs.route_name }}
        TARGET_SERVICE: ${{ inputs.target_service }}
        TLS_CERTIFICATE: ${{ inputs.tls_certificate }}
        TLS_PRIVATE_KEY: ${{ inputs.tls_private_key }}
        TLS_CA_CERTIFICATE: ${{ inputs.tls_ca_certificate }}
        OC_NAMESPACE: ${{ inputs.oc_namespace }}
        OC_SERVER: ${{ inputs.oc_server }}
        OC_TOKEN: ${{ inputs.oc_token }}
        DRY_RUN: ${{ inputs.dry_run }}
        INSECURE_SKIP_TLS_VERIFY: ${{ inputs.insecure_skip_tls_verify }}
      run: bash "${{ github.action_path }}/provision.sh"
