# ==============================================================================
# ARCHITECTURE DECISION RECORD: DO NOT CONVERT THIS ACTION TO JAVASCRIPT
# ==============================================================================
# While BC Gov is standardizing on JavaScript/TypeScript for GitHub Actions, 
# this specific action MUST remain a Composite Bash action. 
#
# Rationale:
# 1. Cryptography: We rely on the natively-installed `openssl` binary for RSA 
#    modulus extraction and matching. Re-implementing this in Node.js requires 
#    importing custom crypto libraries and writing complex parsing logic, which 
#    is inherently risky and less audited than OpenSSL.
# 2. Kubernetes API: We rely on the `oc` binary (installed via our centralized 
#    bcgov/action-oc-runner) to interact with OpenShift. Re-implementing this 
#    in JS would require bundling the massive `@kubernetes/client-node` SDK, 
#    compiling TypeScript, and building complex authentication payloads that `oc` 
#    handles flawlessly natively.
#
# For infrastructure CLI orchestration, Bash remains the superior and safer tool.
# ==============================================================================
name: "OpenShift TLS Vanity Route Provisioner"
description: "Dynamically provisions a secure Vanity Route in OpenShift with cryptographic pre-validation and automated archival backups."
inputs:
  vanity_url:
    description: "The custom vanity URL host (e.g., myapp.bcgov.ca)"
    required: true
  route_name:
    description: "The name of the OpenShift route to create (e.g., myapp-prod-frontend-vanity)"
    required: true
  target_service:
    description: "The name of the OpenShift service to route traffic to"
    required: true
  tls_certificate:
    description: "The public TLS certificate"
    required: true
  tls_private_key:
    description: "The private TLS key"
    required: true
  tls_ca_certificate:
    description: "The CA certificate bundle (optional)"
    required: false
    default: ""
  oc_namespace:
    description: "OpenShift namespace"
    required: true
  oc_server:
    description: "OpenShift server URL"
    required: true
  oc_token:
    description: "OpenShift token"
    required: true
  dry_run:
    description: "If true, skips OpenShift connection and only validates cryptography and YAML generation"
    required: false
    default: "false"
  insecure_skip_tls_verify:
    description: "If true, disables server certificate validation for OpenShift API connection"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Cryptographic Pre-Validation
      shell: bash
      env:
        TLS_CERT: ${{ inputs.tls_certificate }}
        TLS_KEY: ${{ inputs.tls_private_key }}
      run: |
        echo "Validating cryptographic binding between certificate and private key..."
        
        umask 077
        echo "$TLS_CERT" > /tmp/cert.pem
        echo "$TLS_KEY" > /tmp/key.pem
        
        CERT_PUB_SHA=$(openssl x509 -in /tmp/cert.pem -noout -pubkey 2>/dev/null | openssl pkey -pubin -outform der 2>/dev/null | sha256sum | cut -d' ' -f1)
        KEY_PUB_SHA=$(openssl pkey -in /tmp/key.pem -pubout -outform der 2>/dev/null | sha256sum | cut -d' ' -f1)
        
        if [ -z "$CERT_PUB_SHA" ] || [ -z "$KEY_PUB_SHA" ] || [ "$CERT_PUB_SHA" != "$KEY_PUB_SHA" ]; then
          echo "::error::The provided TLS certificate and private key are either invalid or do not mathematically match."
          exit 1
        fi

    - name: Install OpenShift CLI
      if: ${{ inputs.dry_run != 'true' }}
      uses: bcgov/action-oc-runner@main

    - name: Configure OpenShift Connection
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      run: |
        oc login --server=${{ inputs.oc_server }} --token=${{ inputs.oc_token }} --insecure-skip-tls-verify=${{ inputs.insecure_skip_tls_verify }} > /dev/null
        oc project ${{ inputs.oc_namespace }} > /dev/null

    - name: Automated Archival Backup
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      run: |
        ROUTE_NAME="${{ inputs.route_name }}"
        
        if oc get route "$ROUTE_NAME" > /dev/null 2>&1; then
          echo "Existing route found. Archiving working certificates..."
          
          OLD_CERT=$(oc get route "$ROUTE_NAME" -o jsonpath='{.spec.tls.certificate}')
          OLD_KEY=$(oc get route "$ROUTE_NAME" -o jsonpath='{.spec.tls.key}')
          
          if [ -n "$OLD_KEY" ]; then
            CERT_HASH=$(printf '%s' "$OLD_CERT" | sha256sum | cut -d' ' -f1)
            BACKUP_NAME="${ROUTE_NAME}-backup-${CERT_HASH:0:8}"
            
            oc create secret generic "$BACKUP_NAME" \
              --from-literal=tls.crt="$OLD_CERT" \
              --from-literal=tls.key="$OLD_KEY" \
              --dry-run=client -o yaml | oc apply -f -
              
            echo "Certificates archived to secret: $BACKUP_NAME"
          fi
        else
          echo "No existing route found. Skipping archival backup."
        fi

    - name: Provision Vanity Route
      shell: bash
      env:
        VANITY_URL: ${{ inputs.vanity_url }}
        ROUTE_NAME: ${{ inputs.route_name }}
        TARGET_SERVICE: ${{ inputs.target_service }}
        TLS_CERT: ${{ inputs.tls_certificate }}
        TLS_KEY: ${{ inputs.tls_private_key }}
        TLS_CA: ${{ inputs.tls_ca_certificate }}
      run: |
        echo "Dynamically generating and deploying OpenShift Route..."
        
        cat <<EOF > route.yml
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: $ROUTE_NAME
          labels:
            app: $TARGET_SERVICE
        spec:
          host: $VANITY_URL
          to:
            kind: Service
            name: $TARGET_SERVICE
            weight: 100
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
            certificate: |
        $(echo "$TLS_CERT" | sed 's/^/      /')
            key: |
        $(echo "$TLS_KEY" | sed 's/^/      /')
        EOF
        
        # Remove leading spaces from the cat here-doc block
        sed -i 's/^        //' route.yml
        
        if [ -n "$TLS_CA" ]; then
          echo "    caCertificate: |" >> route.yml
          echo "$TLS_CA" | sed 's/^/      /' >> route.yml
        fi

        if [ "${{ inputs.dry_run }}" == "true" ]; then
          echo "DRY RUN: Skipping OpenShift apply. Generated YAML payload:"
          echo "---"
          cat route.yml
          echo "---"
        else
          oc apply -f route.yml
        fi
