name: "Cert Keeper"
description: "Keeps one hostname's SSL/TLS certificate valid on an OpenShift Route: gets a free Let's Encrypt certificate when the host has none or is running low (or installs a pre-supplied certificate), installs it on the Route, and cleans up."
inputs:
  hostname:
    description: "Hostname to keep certified (e.g. myapp.gov.bc.ca). One host, no scheme, no wildcard. Its A/CNAME must already reach the OpenShift router."
    required: true
  email:
    description: "Optional contact email for the ACME account. Let's Encrypt no longer sends expiry emails and every run uses a new account, so most callers leave it out."
    required: false
    default: ""
  route_name:
    description: "Route to create or update with the certificate."
    required: true
  target_service:
    description: "Service the Route sends traffic to."
    required: true
  ca:
    description: "Certificate authority: letsencrypt (browser-trusted, rate limited) or letsencrypt-staging (untrusted test CA)."
    required: false
    default: "letsencrypt"
  force:
    description: "If true, get and install a new certificate even when the current one is not due, for example after a key leak. Counts against the 5 certificates per week limit for this host."
    required: false
    default: "false"
  tls_certificate:
    description: "Pre-supplied leaf certificate PEM. Pass together with tls_private_key and tls_ca_certificate to install an existing certificate (e.g. from GitHub secrets) instead of issuing one from Let's Encrypt."
    required: false
    default: ""
  tls_private_key:
    description: "Pre-supplied private TLS key PEM."
    required: false
    default: ""
  tls_ca_certificate:
    description: "Pre-supplied issuing CA certificate chain PEM (issuer of the leaf first)."
    required: false
    default: ""
  dry_run:
    description: "For pre-supplied certificates only: if true, validate the PEMs, log in, and check the Route without creating the backup Secret or applying the Route."
    required: false
    default: "false"
  oc_namespace:
    description: "OpenShift namespace."
    required: true
  oc_server:
    description: "OpenShift API URL."
    required: true
  oc_token:
    description: "OpenShift token."
    required: true
  timeout:
    description: "Seconds to wait for issuance before cleanup and failure."
    required: false
    default: "300"
outputs:
  due:
    description: "true when a certificate was needed (or pre-supplied), false when the current one was left alone."
    value: ${{ steps.inputs.outputs.supplied == 'true' && 'true' || steps.decide.outputs.due }}
  reason:
    description: "Why a certificate was or was not needed."
    value: ${{ steps.inputs.outputs.supplied == 'true' && 'pre-supplied certificate' || steps.decide.outputs.reason }}
  not_after:
    description: "Expiry of the installed certificate; empty when nothing was installed."
    value: ${{ steps.install.outputs.not_after || steps.issue.outputs.not_after }}

runs:
  using: "composite"
  steps:
    # Undeclared inputs fail here; GitHub only warns
    - name: Check inputs
      uses: bcgov/actions/input-enforcer@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
      with:
        inputs: ${{ toJSON(inputs) }}
        action_path: ${{ github.action_path }}

    # Shared input rules (shared/inputs.sh); a bad value fails here
    - name: Parse Inputs
      id: inputs
      shell: bash
      env:
        INPUT_CA: ${{ inputs.ca }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        HAS_CERT: ${{ inputs.tls_certificate != '' }}
        HAS_KEY: ${{ inputs.tls_private_key != '' }}
        HAS_CA: ${{ inputs.tls_ca_certificate != '' }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.sh
      run: |
        # shellcheck source=/dev/null
        source "$SHARED_INPUTS"
        ca="$(input_enum ca "$INPUT_CA" "letsencrypt letsencrypt-staging" letsencrypt)" || { echo "$ca"; exit 1; }
        force="$(input_bool force "$INPUT_FORCE" false)" || { echo "$force"; exit 1; }
        dry_run="$(input_bool dry_run "$INPUT_DRY_RUN" false)" || { echo "$dry_run"; exit 1; }
        missing=()
        [ "${HAS_CERT:-false}" = "true" ] || missing+=(tls_certificate)
        [ "${HAS_KEY:-false}" = "true" ] || missing+=(tls_private_key)
        [ "${HAS_CA:-false}" = "true" ] || missing+=(tls_ca_certificate)
        case "${#missing[@]}" in
          0)
            supplied=true
            ;;
          3)
            if [ "$dry_run" = "true" ]; then
              echo "::error title=dry_run: requires pre-supplied certificate::dry_run=true requires tls_certificate, tls_private_key and tls_ca_certificate. To rehearse Let's Encrypt issuance on an unused host, set ca: letsencrypt-staging."
              exit 1
            fi
            supplied=false
            ;;
          *)
            echo "::error title=cert-keeper: incomplete certificate inputs::Pre-supplied certificate mode requires tls_certificate, tls_private_key and tls_ca_certificate (missing: ${missing[*]}). Pass all three, or omit all three to issue a Let's Encrypt certificate."
            exit 1
            ;;
        esac
        {
          echo "ca=${ca}"
          echo "force=${force}"
          echo "dry_run=${dry_run}"
          echo "supplied=${supplied}"
        } >> "$GITHUB_OUTPUT"

    # Reads the certificate the host serves today (check.sh, read-only)
    - name: Check current certificate
      id: gate
      if: steps.inputs.outputs.supplied == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_HOSTS: ${{ inputs.hostname }}
        INPUT_LIFETIME_DIVISOR: "3"
        INPUT_MARGIN_DAYS: "0"
        INPUT_TIMEOUT: "10"
        INPUT_FAIL_ON_FINDINGS: "false"
      run: bash "${ACTION_PATH}/check.sh"

    - name: Decide
      id: decide
      if: steps.inputs.outputs.supplied == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST: ${{ inputs.hostname }}
        FORCE: ${{ steps.inputs.outputs.force }}
        FINDINGS: ${{ steps.gate.outputs.findings }}
      run: bash "${ACTION_PATH}/decide.sh"

    - name: Check port 80
      if: steps.decide.outputs.due == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST: ${{ inputs.hostname }}
      run: bash "${ACTION_PATH}/preflight.sh"

    - name: OpenShift CLI
      if: steps.decide.outputs.due == 'true' || steps.inputs.outputs.supplied == 'true'
      uses: $/oc-runner
      with:
        oc_namespace: ${{ inputs.oc_namespace }}
        oc_server: ${{ inputs.oc_server }}
        oc_token: ${{ inputs.oc_token }}

    # Before issuing, so a refusal costs no certificate: the install step rewrites
    # the whole Route, so it must be this host's own
    - name: Check the Route
      if: steps.decide.outputs.due == 'true' || steps.inputs.outputs.supplied == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST: ${{ inputs.hostname }}
        ROUTE_NAME: ${{ inputs.route_name }}
        TARGET_SERVICE: ${{ inputs.target_service }}
      run: bash "${ACTION_PATH}/route-guard.sh"

    - name: Get certificate
      id: issue
      if: steps.decide.outputs.due == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACME_HOST: ${{ inputs.hostname }}
        ACME_EMAIL: ${{ inputs.email }}
        CA: ${{ steps.inputs.outputs.ca }}
        TIMEOUT: ${{ inputs.timeout }}
        OC_NAMESPACE: ${{ inputs.oc_namespace }}
      run: bash "${ACTION_PATH}/issue.sh"

    - name: Install on the Route
      id: install
      if: steps.decide.outputs.due == 'true' || steps.inputs.outputs.supplied == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ROUTE_HOST: ${{ inputs.hostname }}
        ROUTE_NAME: ${{ inputs.route_name }}
        TARGET_SERVICE: ${{ inputs.target_service }}
        TLS_CERTIFICATE: ${{ inputs.tls_certificate || steps.issue.outputs.tls_certificate }}
        TLS_PRIVATE_KEY: ${{ inputs.tls_private_key || steps.issue.outputs.tls_private_key }}
        TLS_CA_CERTIFICATE: ${{ inputs.tls_ca_certificate || steps.issue.outputs.tls_ca_certificate }}
        OC_NAMESPACE: ${{ inputs.oc_namespace }}
        OC_SERVER: ${{ inputs.oc_server }}
        OC_TOKEN: ${{ inputs.oc_token }}
        DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
      run: bash "${ACTION_PATH}/install.sh"
